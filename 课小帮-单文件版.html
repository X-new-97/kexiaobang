<style>
/* 课小帮 · 定制样式（手绘草稿风皮肤）
 * 基础组件（按钮 / 列表 / 徽标 / 表单）来自 WeUI 2.6.26（Tencent，MIT 协议）
 * 本文件只负责布局、业务组件与主题外观，不重复实现 WeUI 已有能力。
 * 主题：纸张底色 + 细网格 + 不规则圆角 + 浅蓝/奶油黄/淡绿三色
 */
:root {
  /* 版心与留白：占屏 94%，最宽 1760px；小屏由 padding 兜底 */
  --page-max: min(1760px, 94vw);
  --page-pad: clamp(16px, 3.2vw, 40px);

  /* 三色体系：浅蓝（可信）/ 奶油黄（亲切）/ 淡绿（成长） */
  --brand: #7da9d9;
  --brand-dark: #5f87b8;
  --brand-soft: #edf4fc;

  --text: #3e4a5b;
  --text-sub: #6e7a8c;
  --ink: #3e4a5b;

  --border: #d9dfe7;
  --border-strong: #c6d0dc;

  --paper: #fffdf8;
  --paper-2: #fbf8f1;
  --paper-3: #f6f2e9;

  --ok: #a6c9ae;
  --ok-soft: #edf5ee;
  --ok-ink: #5c7f66;
  --ok-line: #b2cdb9;

  --mid: #e3c77e;
  --mid-soft: #fcf5e2;
  --mid-ink: #8a6e22;
  --mid-line: #e0c883;

  --bad: #d9a29b;
  --bad-soft: #fbedea;
  --bad-ink: #9c5a53;
  --bad-line: #dba9a2;

  --shadow: rgba(62, 74, 91, 0.06);
  --shadow-2: rgba(62, 74, 91, 0.10);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  /* animal-island-ui · Background default：奶油底 + 两层错位波点 */
  background-color: #f7f3df;
  background-image:
    radial-gradient(circle, rgba(196, 184, 158, 0.15) 1.5px, transparent 1.5px),
    radial-gradient(circle, rgba(196, 184, 158, 0.10) 1px, transparent 1px);
  background-size: 28px 28px, 14px 14px;
  background-position: 0 0, 7px 7px;
  color: var(--text);
  font-family: "LXGW WenKai", "Kaiti SC", KaiTi, STKaiti, "Noto Serif SC", "Songti SC", serif;
  font-size: clamp(14px, 0.3vw + 12.6px, 16.5px);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* 顶栏 */
.top {
  background: var(--paper);
  border-bottom: 1.5px dashed var(--border-strong);
  position: sticky; top: 0; z-index: 10;
}
.top-inner {
  max-width: var(--page-max); margin: 0 auto; padding: 18px var(--page-pad) 10px;
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; flex-wrap: wrap;
}
h1 { font-size: clamp(21px, 0.55vw + 16.5px, 28px); font-weight: 700; margin: 0; letter-spacing: 2px; color: var(--ink); }
h2 { font-size: clamp(16px, 0.35vw + 13px, 21px); font-weight: 700; margin: 0 0 12px; color: var(--ink); letter-spacing: 0.5px; }
h3 { font-size: 14px; font-weight: 700; margin: 20px 0 8px; color: var(--text-sub); }
.sub { color: var(--text-sub); font-size: 13px; margin: 4px 0 0; }
.top-right { text-align: right; }
.cur { display: block; color: var(--text-sub); font-size: 12px; margin-bottom: 8px; }

.tabs { max-width: var(--page-max); margin: 0 auto; padding: 0 calc(var(--page-pad) - 8px); display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  background: var(--paper);
  border: 1.5px solid var(--border-strong);
  border-radius: 16px 18px 14px 20px / 18px 14px 20px 16px;
  padding: 8px 16px; font-size: 14px; color: var(--text-sub); cursor: pointer;
  font-family: inherit; margin-bottom: 8px;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.tab:hover { background: var(--brand-soft); color: var(--brand-dark); }
.tab.active {
  color: var(--brand-dark); background: var(--brand-soft);
  border-color: var(--brand); font-weight: 700;
}
.tab.locked { opacity: 0.45; }
.tab.locked.active { opacity: 1; }

.wrap { max-width: var(--page-max); margin: 0 auto; padding: 16px var(--page-pad) 8px; }
.foot {
  max-width: var(--page-max); margin: 16px auto 40px; padding: 0 var(--page-pad);
  color: var(--text-sub); font-size: 12px; line-height: 1.7;
}

/* 卡片：细描边 + 极轻贴纸投影 */
.card {
  background: var(--paper); border: 1.5px solid var(--border-strong);
  border-radius: 18px 22px 16px 20px / 20px 16px 22px 18px;
  padding: clamp(16px, 0.9vw + 8px, 26px); margin-bottom: 16px;
  box-shadow: 2px 3px 0 var(--shadow);
}
/* 用 minmax(0, ·) 防止长内容把列撑破；880px 起收成单列，避免中间宽度太挤
 * 学生档案页：左列（标题 / 表单 / 学生列表）+ 右列详情卡 */
.grid {
  display: grid; grid-template-columns: minmax(0, clamp(300px, 22vw, 420px)) minmax(0, 1fr);
  gap: clamp(14px, 2vw, 28px); align-items: start;
}
.grid > * { min-width: 0; }
.col-left { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.col-left .list-head { margin-top: 0; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* 大屏：版心再放宽一档；字号与内边距由 clamp() 连续缩放，不再硬编码 */
@media (min-width: 1200px) {
  .tab { padding: 9px 18px; }
}
@media (min-width: 1500px) {
  /* 宽屏时让卡片内容也有呼吸感，避免文字贴边 */
  .wrap { padding-top: 20px; }
}

/* 窄屏：标签页改为横向滚动，避免换行把顶栏撑高 */
@media (max-width: 720px) {
  .tabs {
    flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; white-space: nowrap; }
  .top-inner { padding-top: 14px; padding-bottom: 6px; }
  .top-right { text-align: left; }
  .card { padding: 16px; }
}

@media (max-width: 480px) {
  .wrap, .top-inner, .foot { padding-left: 14px; padding-right: 14px; }
  .card { padding: 14px; }
  .trend-date { width: 64px; }
  .stat { min-width: 68px; }
  h1 { font-size: 20px; }
}

.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.muted { color: var(--text-sub); }
.small { font-size: 12px; }

/* 学生列表：使用 WeUI cells，这里套手绘外框 */
.list-head {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  flex-wrap: wrap; margin-top: 6px;
}
.list-head .weui-cells__title { margin: 0; padding: 0; color: var(--text-sub); font-size: 13px; }
/* 「添加学生」不在 .actions 里，需要单独覆盖 WeUI 的绿底主按钮 */
.list-head .weui-btn {
  border-radius: 999px !important;
  border: 1.5px solid var(--brand) !important;
  background: var(--brand-soft) !important;
  color: var(--brand-dark) !important;
  font-family: inherit; font-weight: 700;
  box-shadow: 0 3px 0 #cfddeb;
}
.list-head .weui-btn:active { background: #e4effb !important; }

/* 添加学生表单 */
.add-form { margin-top: 10px; }
.add-form h3 { margin: 0 0 10px; }
.form-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
}
.form-row label {
  flex: 0 0 72px; font-size: 13px; color: var(--text-sub);
}
.form-row .weui-input {
  flex: 1 1 180px; min-width: 0; height: 38px; padding: 0 12px;
  font-size: 14px; color: var(--text); background: var(--paper);
  border: 1.5px solid var(--border-strong); border-radius: 11px 13px 10px 12px;
  font-family: inherit;
}
.form-row .weui-input:focus { outline: none; border-color: var(--brand); background: var(--brand-soft); }

.stu-list {
  margin-top: 4px;
  border: 1.5px solid var(--border-strong);
  border-radius: 16px 20px 14px 18px / 18px 14px 20px 16px;
  overflow: hidden;
  box-shadow: 2px 3px 0 var(--shadow);
}
.stu-item { position: relative; cursor: pointer; background: var(--paper); transition: background 0.2s; padding: 12px 14px; }
.stu-item:hover { background: var(--brand-soft); }
.stu-item.active { background: var(--brand-soft); }
/* 把「年级 · 课次」提到右上角，避免窄栏里和掌握统计抢一行 */
.stu-item .weui-cell__bd { width: 100%; }
.stu-item .weui-cell__ft {
  position: absolute; right: 14px; top: 14px;
  font-size: 11px; color: var(--text-sub); white-space: nowrap;
}
.stu-item .stu-name { padding-right: 86px; }
.stu-item .small { font-size: 11.5px; }
.stu-name { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: var(--ink); }
.bar {
  display: flex; height: 9px; margin: 8px 0 4px;
  border-radius: 999px; overflow: hidden; background: var(--paper-3);
  border: 1px solid #eae6dc;
}
.seg { display: block; height: 100%; }
.seg.ok { background: var(--ok); }
.seg.mid { background: var(--mid); }
.seg.bad { background: var(--bad); }

/* 统计 */
.stat-row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.stat {
  flex: 1; min-width: 80px; text-align: center;
  border-radius: 14px 17px 13px 16px / 16px 13px 17px 14px;
  padding: clamp(12px, 0.8vw, 18px) 8px; background: var(--paper);
  border: 1.5px solid var(--border);
}
.stat.ok { background: var(--ok-soft); color: var(--ok-ink); border-color: var(--ok-line); }
.stat.mid { background: var(--mid-soft); color: var(--mid-ink); border-color: var(--mid-line); }
.stat.bad { background: var(--bad-soft); color: var(--bad-ink); border-color: var(--bad-line); }
.stat-num { font-size: clamp(23px, 0.45vw + 18px, 30px); font-weight: 700; }
.stat-label { font-size: 12px; }

/* 标签 */
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0; }
.chip {
  border-radius: 999px; padding: 5px 12px; font-size: 12px;
  background: var(--paper); border: 1.5px solid var(--border-strong);
}
.chip.weak { background: var(--bad-soft); color: var(--bad-ink); border-color: var(--bad-line); }
.chip.fuzzy { background: var(--mid-soft); color: var(--mid-ink); border-color: var(--mid-line); }
.chip.mastered { background: var(--ok-soft); color: var(--ok-ink); border-color: var(--ok-line); }

.chip-btn {
  border: 1.5px solid var(--border-strong); background: var(--paper); border-radius: 999px;
  padding: 6px 14px; font-size: 12px; cursor: pointer; color: var(--text);
  font-family: inherit; line-height: 1.4;
  box-shadow: 0 2px 0 var(--shadow);
}
.chip-btn em { font-style: normal; color: var(--text-sub); font-size: 11px; }
.chip-btn.weak { border-color: var(--bad-line); }
.chip-btn.fuzzy { border-color: var(--mid-line); }
.chip-btn.mastered { border-color: var(--ok-line); }
.chip-btn.on { background: var(--brand-soft); color: var(--brand-dark); border-color: var(--brand); font-weight: 700; }
.chip-btn.on em { color: var(--brand-dark); opacity: 0.75; }
/* 题库暂未覆盖的知识点：弱化并禁用 */
.chip-btn.noq { opacity: 0.42; cursor: not-allowed; border-style: dashed; box-shadow: none; }
.chip-btn.noq em { color: var(--text-sub); }

.unit { margin: 12px 0; }
.unit-name { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
.more { margin-top: 12px; }
.more summary { cursor: pointer; font-size: 13px; color: var(--brand-dark); }

/* 趋势 */
.trend { margin: 8px 0; }
.trend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.trend-date { font-size: 12px; color: var(--text-sub); width: 84px; }
.trend-bar {
  flex: 1; height: 10px; background: var(--paper-3);

}

.trend-val { font-size: 12px; width: 40px; text-align: right; }

/* 趋势折线图（内联 SVG） */
.chart { position: relative; padding-left: 40px; padding-bottom: 26px; margin: 14px 0 6px; }
.chart-y {
  position: absolute; left: 0; top: 0; height: 180px; width: 34px;
  display: flex; flex-direction: column; justify-content: space-between;
  font-size: 11px; color: var(--text-sub); text-align: right; line-height: 1;
}
.chart-plot { position: relative; height: 180px; }
.chart-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart-dot {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  background: var(--paper); border: 2.5px solid var(--brand);
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 2px rgba(255, 253, 248, .9);
}
.chart-val {
  position: absolute; transform: translate(-50%, -150%);
  font-size: 11.5px; font-weight: 700; color: var(--brand-dark); white-space: nowrap;
}
.chart-date {
  position: absolute; top: 188px; transform: translateX(-50%);
  font-size: 11px; color: var(--text-sub); white-space: nowrap;
}
/* 首尾标签贴边，避免被裁掉 */
.chart-val.first { transform: translate(0, -150%); }
.chart-val.last { transform: translate(-100%, -150%); }
.chart-date.first { transform: translateX(0); }
.chart-date.last { transform: translateX(-100%); }

/* 最近课次 */
.lesson-list { margin: 4px 0; border-top: 1.5px dashed var(--border-strong); }
.lesson-row {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 11px 0; border-bottom: 1.5px dashed var(--border-strong);
}
.lesson-date { flex: 0 0 48px; font-size: 12px; color: var(--text-sub); line-height: 1.5; padding-top: 1px; }

.lesson-rate { flex: 0 0 auto; font-size: 13px; font-weight: 700; color: var(--brand-dark); line-height: 1.5; padding-top: 1px; }

.section { border-top: 1.5px dashed var(--border-strong); padding-top: 14px; margin-top: 14px; }
.tag {

}
.tag.weak { background: var(--bad-soft); color: var(--bad-ink); border-color: var(--bad-line); }
.tag.fuzzy { background: var(--mid-soft); color: var(--mid-ink); border-color: var(--mid-line); }
.tag.mastered { background: var(--ok-soft); color: var(--ok-ink); border-color: var(--ok-line); }
.tip {

.goals { margin: 4px 0; padding-left: 20px; font-size: 13px; }
.goals li { margin-bottom: 4px; }

.qlist { list-style: none; margin: 8px 0; padding: 0; }
.qitem {
  border: 1.5px solid var(--border-strong);

}
.qtag {

}
.stem { margin: 8px 0; font-size: 15px; overflow-wrap: anywhere; }
.qans {
  background: var(--paper-2); border: 1.5px dashed var(--border-strong);

}
.qbtns, .mark { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* 按钮：统一成手绘药丸，覆盖 WeUI 的方角绿底 */
/* WeUI 默认 min-width:184px + 左右 auto 外边距，窄屏撑不下去会横向溢出导致整体位移，这里统一解除 */
.wrap .weui-btn, .top-right .weui-btn {
  display: inline-block; min-width: 0; max-width: 100%;
  width: auto; margin-left: 0; margin-right: 0;
}
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.actions .weui-btn,
.qbtns .weui-btn,
.mark .weui-btn,
.tones .weui-btn {
  min-width: 0; width: auto; margin: 0;

}
.actions .weui-btn_primary,
.qbtns .weui-btn_primary,
.tones .weui-btn_primary {
  background: var(--brand-soft) !important;
  border-color: var(--brand) !important;
  color: var(--brand-dark) !important;
  font-weight: 700;
  box-shadow: 0 3px 0 #cfddeb;
}
.weui-btn_primary:not(.weui-btn_disabled):active,
.actions .weui-btn_primary:active {
  background: #e4effb !important;
}
.actions .weui-btn { padding: 10px 20px; font-size: 15px; }
.top-right .weui-btn {
  margin: 0; border-radius: 999px !important;
  border: 1.5px solid var(--border-strong) !important;
  background: var(--paper) !important; color: var(--ink) !important;
}
.weui-btn_default:not(.weui-btn_disabled):active { background: var(--paper-2) !important; }

/* 三态勾选 */
.mark-btn { border: 1.5px solid var(--border-strong) !important; }
.mark-btn.ok.on { background: var(--ok) !important; color: #2f5a3c !important; border-color: var(--ok-line) !important; }
.mark-btn.partial.on { background: var(--mid) !important; color: #6b5310 !important; border-color: var(--mid-line) !important; }

.talk {
  background: var(--paper-2); border: 1.5px solid var(--border-strong);

  padding: 16px; font-size: 15px; line-height: 1.95; white-space: pre-wrap;
}
.export {

}
.report {

/* 提示条 */
.toast {

  background: var(--ink); color: #fffdf8;

.empty { text-align: center; padding: 48px 20px; }

.who {

}

.login-brand .logo {

  border-radius: 16px 20px 14px 18px / 18px 14px 20px 16px;
  background: var(--brand-soft); color: var(--brand-dark); font-size: 25px; text-align: center;
  border: 1.5px solid var(--brand);
  box-shadow: 2px 3px 0 var(--shadow);
  font-weight: 700;
  transform: rotate(-2deg);
}
.login-card .actions { margin-top: 16px; }
.login-card .actions .weui-btn { width: 100%; }
.login-card .weui-btn {
  margin: 0 0 10px;
  border-radius: 999px !important;
  border: 1.5px solid var(--border-strong) !important;
  background: var(--paper) !important;
  color: var(--ink) !important;
  font-family: inherit;
  min-width: 0;
  box-shadow: 0 2px 0 var(--shadow);
}
.login-card .weui-btn_primary {
  background: var(--brand-soft) !important;
  border-color: var(--brand) !important;
  color: var(--brand-dark) !important;
  font-weight: 700;
  box-shadow: 0 3px 0 #cfddeb;
}
.login-sep {
  display: flex; align-items: center; gap: 10px;

}

}
.login-accounts { margin-top: 14px; }
.login-accounts .chips { margin-top: 6px; }
/* 学生入口：两列卡片网格，比 chips 更整齐、点击区域更大 */
.stu-list {
  display: grid; grid-template-columns: 1fr 1fr; gap: 9px;
  margin: 4px 0 8px;
}
.stu-item {
  display: block; width: 100%; text-align: left;
  padding: 10px 12px;
  background: var(--paper);
  border: 1.5px solid var(--border-strong);
  border-radius: 12px 15px 12px 15px / 15px 12px 15px 12px;
  box-shadow: 0 2px 0 var(--shadow);
  cursor: pointer; font-family: inherit;
}
.stu-item:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--shadow); }
.stu-item-name { display: block; font-weight: 700; font-size: 15px; }
.stu-item-sub { display: block; font-size: 11px; color: var(--text-sub); margin-top: 2px; }
.login-note {
  font-size: 12px; color: var(--text-sub); line-height: 1.6;
  margin: 14px 0 0; padding-top: 12px; border-top: 1.5px dashed var(--border-strong);
}

/* ---------- 课堂互动小游戏 ---------- */
.game-card { border-color: var(--brand); background: linear-gradient(180deg, #fffdf6 0%, var(--paper) 62%); }

/* 判定方式切换 */
.gm { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; margin: 12px 0; }
.gm-label { font-size: 12px; color: var(--text-sub); align-self: center; }
.gj {
  flex: 1 1 220px; text-align: left; cursor: pointer; font-family: inherit;
  border: 1.5px solid var(--border-strong); background: var(--paper);
  border-radius: 14px 17px 13px 16px / 16px 13px 17px 14px;
  padding: 8px 12px; box-shadow: 0 2px 0 var(--shadow);
  display: flex; flex-direction: column; gap: 2px;
}
.gj strong { font-size: 13.5px; color: var(--ink); }
.gj span { font-size: 11.5px; color: var(--text-sub); line-height: 1.45; }
.gj.on { background: var(--brand-soft); border-color: var(--brand); box-shadow: 0 3px 0 #cfddeb; }
.gj.on strong { color: var(--brand-dark); }

/* 入口卡片 */
.gm-entry { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.ge-card {
  flex: 1 1 260px; min-width: 0; padding: 14px;
  border: 1.5px solid var(--border-strong); background: var(--paper-2);
  border-radius: 18px 22px 16px 20px / 20px 16px 22px 18px;

}
.ge-card.run { border-color: var(--ok-line); background: var(--ok-soft); }
.ge-card.boss { border-color: var(--bad-line); background: var(--bad-soft); }

.ge-ico {
  width: 34px; height: 34px; line-height: 31px; text-align: center; font-size: 18px;
  border-radius: 12px 15px 10px 13px / 13px 10px 15px 12px;
  background: var(--paper); border: 1.5px solid var(--border-strong); transform: rotate(-3deg);
}
.ge-t { font-size: 15px; font-weight: 700; color: var(--ink); }
.ge-d { font-size: 12.5px; color: var(--text-sub); flex: 1; line-height: 1.55; }
.ge-card .weui-btn { align-self: flex-start; }
.boss-preview { margin-top: 10px; }
.boss-preview .chips { margin-top: 2px; }

.gtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.gtitle { flex: 1; font-size: 16px; font-weight: 700; color: var(--ink); }
.gmode-tag {

  background: var(--brand-soft); color: var(--brand-dark); border: 1.5px solid var(--brand);
}
.gbar {
  height: 9px; background: var(--paper-3); border-radius: 999px; overflow: hidden;

}

.gbanner {
  margin: 10px 0; padding: 8px 12px; font-size: 13px; text-align: center;
  background: var(--mid-soft); border: 1.5px dashed var(--mid-line);
  border-radius: 14px 17px 12px 15px / 15px 12px 17px 14px; color: var(--mid-ink);
}
.gq { margin-top: 10px; }
.gq-meta { font-size: 12px; color: var(--text-sub); }
.gjudge { margin-top: 12px; }

.gans {

  padding: 11px 22px; margin: 0 8px 8px 0; color: var(--ink);
  border: 1.5px solid var(--border-strong); background: var(--paper);

.gans.mid { background: var(--mid-soft); border-color: var(--mid-line); color: var(--mid-ink); }
.gans.bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad-ink); }

.greveal {
  margin-top: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.6;
  border: 1.5px solid var(--border-strong); border-radius: 14px 17px 12px 15px / 15px 12px 17px 14px;
  background: var(--paper-2);
}
.greveal.ok { background: var(--ok-soft); border-color: var(--ok-line); }
.greveal.mid { background: var(--mid-soft); border-color: var(--mid-line); }
.greveal.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.gr-fb { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.gr-mark { margin-top: 6px; font-size: 13px; }
.gfix { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* 错题怪血条 */
.boss-list { margin: 10px 0 4px; display: flex; flex-direction: column; gap: 6px; }
.boss-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px;
  border: 1.5px dashed var(--border-strong); border-radius: 12px 15px 10px 13px / 13px 10px 15px 12px;
  background: var(--paper);
}
.boss-item.cur { border-style: solid; border-color: var(--bad-line); background: var(--bad-soft); }
.boss-item.dead { opacity: 0.55; }
.boss-item .bn { flex: 1 1 auto; min-width: 0; font-size: 12.5px; }
.hp {
  flex: 0 0 96px; height: 9px; background: var(--paper-3); border-radius: 999px;
  overflow: hidden; border: 1px solid #eae6dc;
}
.hp span { display: block; height: 100%; background: var(--bad); transition: width .3s; }
.boss-item .bs { flex: 0 0 52px; text-align: right; font-size: 11.5px; color: var(--text-sub); }

.gfoot {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  flex-wrap: wrap; margin-top: 12px; padding-top: 10px;
  border-top: 1.5px dashed var(--border-strong); font-size: 12px; color: var(--text-sub);
}
.gstars .st { font-style: normal; font-size: 17px; color: #dcd6c8; margin-left: 2px; }
.gstars .st.on { color: var(--mid); }
.gstars .st.half { color: var(--mid); opacity: 0.5; }

/* 结算 */
.gresult { text-align: center; padding: 6px 0 2px; }
.gr-stars .bst { font-style: normal; font-size: 40px; color: #dcd6c8; margin: 0 4px; }
.gr-stars .bst.on { color: var(--mid); }
.gr-rate { font-size: 26px; font-weight: 700; color: var(--brand-dark); margin-top: 2px; }

/* WeUI 单元格底色统一为米白 */
.weui-cells { background: var(--paper); }
.weui-cell { background: var(--paper); }

@media print {
  .top, .foot, .actions, .tabs, .game-card { display: none; }
  .wrap { padding: 0; }
  body { background: #fff; }
  .card, .qitem, .talk, .report { border-color: #ccc; box-shadow: none; }
}

<script>
/* 知识点体系：人教版小学数学 四年级下册

window.KB_KNOWLEDGE = {

  subject: "数学",

  term: "下册",
  version: "人教版",

  units: [

<script>
/* 教材（学科 + 年级 + 册次）索引层
 * ── 为什么要有这一层 ──
 * 知识点体系按「学科 / 年级 / 册次 / 版本」解耦存放，页面与生成引擎只面向「当前教材」取数。
 * 这样新增一个年级时，只需按下面的 schema 再注册一份数据，其余代码一行都不用改。
 *
 * ── 扩展一份新教材的做法 ──
 *   1. 新建 data/knowledge/syllabus-<学科>-<年级><册次>.js，例如 syllabus-math-g5a.js
 *   2. 文件末尾写：window.KB_Syllabus.register({ key:"math-g5a", subject:"数学",
 *        grade:"小学五年级", term:"上册", textbook:"人教版", levels:{...}, units:[...], questions:{...} })
 *   3. 在 index.html 里加一行 <script src="...">
 *   4. 在 app.js 的 GRADE_SYLLABUS 里加一条 年级 → key 的映射
 * 知识点 schema：{ id, name, level:1|2|3, tip, errors:[...] }
 * 题目   schema：{ id, level, stem, answer, solution, errorTag }
 */
(function () {
  "use strict";

  var registry = {};
  var DEFAULT_KEY = "math-g4b";

  var Syllabus = {
    register: function (item) {
      if (!item || !item.key) return;
      registry[item.key] = item;
    },
    keys: function () { return Object.keys(registry); },
    /* 供界面展示的教材清单 */
    list: function () {
      return Object.keys(registry).map(function (k) {
        var s = registry[k];
        return {
          key: k,
          label: s.subject + " · " + s.grade + s.term + "（" + s.textbook + "）",
          subject: s.subject, grade: s.grade, term: s.term, textbook: s.textbook
        };
      });
    },
    get: function (key) { return registry[key] || null; },
    has: function (key) { return !!registry[key]; },
    defaultKey: function () { return DEFAULT_KEY; },
    currentKey: DEFAULT_KEY,
    setCurrent: function (key) {
      if (registry[key]) Syllabus.currentKey = key;
      else Syllabus.currentKey = DEFAULT_KEY;
    },
    current: function () { return registry[Syllabus.currentKey] || registry[DEFAULT_KEY]; },
    /* 教材未接入时用于界面提示 */
    labelOf: function (key) {
      var s = registry[key] || registry[DEFAULT_KEY];
      return s.subject + " · " + s.grade + s.term + "（" + s.textbook + "）";
    }
  };

  /* 注册已接入的教材：人教版四年级下册数学（数据见 knowledge-math-g4.js / question-bank.js） */
  Syllabus.register({
    key: DEFAULT_KEY,
    subject: window.KB_KNOWLEDGE.subject,
    grade: "小学四年级",
    term: window.KB_KNOWLEDGE.term,
    textbook: window.KB_KNOWLEDGE.version,
    levels: window.KB_KNOWLEDGE.levels,
    units: window.KB_KNOWLEDGE.units,
    questions: window.KB_QUESTIONS
  });

  window.KB_Syllabus = Syllabus;
})();

</script>
<script>
/* 数据层：本地存储 + 知识点/题库索引 + 学情统计
 * 一期使用浏览器 localStorage，二期可替换为云数据库，接口保持不变。
 */
(function () {
  "use strict";

  /* 存储分区：
   *   老师账号表   kexiaobang.teachers.v1
   *   当前登录态   kexiaobang.session.v1
   *   学生数据     kexiaobang.students.v2.<teacherId>   ← 按老师隔离
   * 二期接云数据库时，只需把 "<teacherId>" 换成查询条件，接口不变。
   */
  var TEACHER_KEY = "kexiaobang.teachers.v1";
  var SESSION_KEY = "kexiaobang.session.v1";
  var STUDENTS_PREFIX = "kexiaobang.students.v2.";
  var LEGACY_KEY = "kexiaobang.students.v1";
  var STU_SESSION_KEY = "kexiaobang.student.session.v1";
  var HW_PREFIX = "kexiaobang.homework.v1.";
  var DEMO_ID = "t-demo";

  var STATUS = { mastered: "掌握", fuzzy: "模糊", weak: "薄弱" };
  var STATUS_ORDER = ["weak", "fuzzy", "mastered"];
  var RESULT_WEIGHT = { ok: 1, partial: 0.5, wrong: 0 };

  function readJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function writeJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function uid(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* ---------- 老师账号 ----------
   * 一期定位：身份标识，用于区分不同老师的学生档案，不是安全认证。
   * 不校验密码；同名（去除首尾空格后完全相同）视为同一账号。
   * 二期接微信登录 / 账号密码后，替换本模块即可，其余代码不用动。
   */
  var Teacher = {
    all: function () { return readJSON(TEACHER_KEY, []); },
    save: function (list) { writeJSON(TEACHER_KEY, list); },
    get: function (id) {
      var list = Teacher.all();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    },
    currentId: function () {
      try { return localStorage.getItem(SESSION_KEY) || null; } catch (e) { return null; }
    },
    current: function () {
      var id = Teacher.currentId();
      return id ? Teacher.get(id) : null;
    },
    findByName: function (name) {
      var list = Teacher.all(), key = String(name || "").trim();
      for (var i = 0; i < list.length; i++) if (list[i].name === key) return list[i];
      return null;
    },
    /* 输入姓名进入：已存在则登入，否则创建新账号（学生档案为空） */
    enter: function (name) {
      var key = String(name || "").trim();
      if (!key) return { error: "请输入姓名" };
      var exist = Teacher.findByName(key);
      if (exist) {
        try { localStorage.setItem(SESSION_KEY, exist.id); } catch (e) {}
        return { teacher: exist, created: false };
      }
      var t = {
        id: uid("t"),
        name: key,
        demo: false,
        createdAt: new Date().toISOString().slice(0, 10)
      };
      var list = Teacher.all();
      list.push(t);
      Teacher.save(list);
      try { localStorage.setItem(SESSION_KEY, t.id); } catch (e) {}
      return { teacher: t, created: true };
    },
    login: function (id) {
      try { localStorage.setItem(SESSION_KEY, id); } catch (e) {}
    },
    logout: function () {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    },
    /* 演示账号：自带 3 位学生与累计学情，用于现场展示闭环 */
    ensureDemo: function () {
      var list = Teacher.all(), demo = null;
      for (var i = 0; i < list.length; i++) if (list[i].id === DEMO_ID) demo = list[i];
      if (!demo) {
        demo = { id: DEMO_ID, name: "林老师", demo: true, createdAt: new Date().toISOString().slice(0, 10) };
        list.unshift(demo);
        Teacher.save(list);
      }
      var key = STUDENTS_PREFIX + DEMO_ID;
      /* 旧版本（无账号体系）的数据直接迁移给演示账号，避免用户已有记录丢失 */
      var legacy = null;
      try { legacy = localStorage.getItem(LEGACY_KEY); } catch (e) {}
      if (legacy && !localStorage.getItem(key)) {
        try {
          localStorage.setItem(key, legacy);
          localStorage.removeItem(LEGACY_KEY);
        } catch (e) {}
      }
      if (!localStorage.getItem(key)) {
        writeJSON(key, window.KB_SAMPLE_STUDENTS || []);
      }
      return demo;
    }
  };

  function studentsKey() {
    var t = Teacher.current();
    return STUDENTS_PREFIX + (t ? t.id : "guest");
  }

  var Store = {
    all: function () {
      var key = studentsKey(), t = Teacher.current();
      var raw = null;
      try { raw = localStorage.getItem(key); } catch (e) {}
      if (raw) {
        try { return JSON.parse(raw); } catch (e) {}
      }
      /* 首次进入该账号：演示账号带示例学生，其他账号从空档案开始 */
      var seed = (t && t.demo) ? (window.KB_SAMPLE_STUDENTS || []) : [];
      writeJSON(key, seed);
      return JSON.parse(JSON.stringify(seed));
    },
    saveAll: function (list) {
      writeJSON(studentsKey(), list);
    },
    get: function (id) {
      var list = Store.all();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    },
    update: function (student) {
      var list = Store.all();
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === student.id) { list[i] = student; break; }
      }
      Store.saveAll(list);
    },
    /* 加随机后缀，避免同一毫秒内连续添加产生重复 id */
    newId: function () {
      var id;
      do {
        id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      } while (Store.get(id));
      return id;
    },
    add: function (student) {
      var list = Store.all();
      list.push(student);
      Store.saveAll(list);
      return student;
    },
    remove: function (id) {
      var list = Store.all();
      var next = [];
      for (var i = 0; i < list.length; i++) if (list[i].id !== id) next.push(list[i]);
      Store.saveAll(next);
    },
    /* ---------- 学生端：按指定老师账号读取（不依赖当前登录的是谁） ---------- */
    allOf: function (teacherId) {
      var raw = null;
      try { raw = localStorage.getItem(STUDENTS_PREFIX + teacherId); } catch (e) {}
      if (raw) { try { return JSON.parse(raw); } catch (e) {} }
      return [];
    },
    getOf: function (teacherId, studentId) {
      var list = Store.allOf(teacherId);
      for (var i = 0; i < list.length; i++) if (list[i].id === studentId) return list[i];
      return null;
    },
    /* 学生登录用：列出本机全部学生（跨老师账号，附带所属老师） */
    allAcrossTeachers: function () {
      Teacher.ensureDemo();
      var teachers = Teacher.all(), out = [];
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (!k || k.indexOf(STUDENTS_PREFIX) !== 0) continue;
          var tid = k.slice(STUDENTS_PREFIX.length), list = null;
          try { list = JSON.parse(localStorage.getItem(k)); } catch (e) {}
          if (!list || !list.length) continue;
          var t = null;
          for (var j = 0; j < teachers.length; j++) if (teachers[j].id === tid) t = teachers[j];
          for (var m = 0; m < list.length; m++) {
            out.push({ teacherId: tid, teacherName: t ? t.name : "", student: list[m] });
          }
        }
      } catch (e) {}
      return out;
    },
    reset: function () {
      try { localStorage.removeItem(studentsKey()); } catch (e) {}
    },
    /* 当前账号下的学生数，用于登录页展示 */
    count: function () {
      var key = studentsKey(), raw = null;
      try { raw = localStorage.getItem(key); } catch (e) {}
      if (!raw) return 0;
      try { return JSON.parse(raw).length; } catch (e) { return 0; }
    }
  };

  /* ---------- 学生端登录态 ----------
   * 一期同样是身份标识：点名字即进入，二期接微信登录后由 openid 对应本人。
   */
  var StuSession = {
    get: function () { return readJSON(STU_SESSION_KEY, null); },
    set: function (teacherId, studentId) { writeJSON(STU_SESSION_KEY, { teacherId: teacherId, studentId: studentId }); },
    clear: function () { try { localStorage.removeItem(STU_SESSION_KEY); } catch (e) {} }
  };

  /* ---------- 作业完成状态 ----------
   * 只记学生本地的完成打勾，属于“练习记录”，不参与学情计算、不写回学生档案。
   */
  var Homework = {
    key: function (teacherId, studentId) { return HW_PREFIX + teacherId + "." + studentId; },
    get: function (teacherId, studentId) { return readJSON(Homework.key(teacherId, studentId), {}); },
    mark: function (teacherId, studentId, qid, done) {
      var m = Homework.get(teacherId, studentId);
      if (done) m[qid] = new Date().toISOString().slice(0, 10);
      else delete m[qid];
      writeJSON(Homework.key(teacherId, studentId), m);
      return m;
    }
  };

  /* 当前教材：新增年级只需注册新 syllabus，这里无需改动 */
  function syll() {
    return (window.KB_Syllabus && window.KB_Syllabus.current()) || window.KB_KNOWLEDGE;
  }
  function bank() {
    return syll().questions || window.KB_QUESTIONS;
  }

  var KB = {
    /* 当前教材元信息，用于界面显示 */
    meta: function () { return syll(); },
    units: function () { return syll().units; },
    kpIndex: function () {
      var map = {};
      var units = syll().units;
      for (var i = 0; i < units.length; i++) {
        for (var j = 0; j < units[i].kps.length; j++) {
          var kp = units[i].kps[j];
          map[kp.id] = { kp: kp, unit: units[i] };
        }
      }
      return map;
    },
    allKps: function () {
      var out = [], units = syll().units;
      for (var i = 0; i < units.length; i++) {
        for (var j = 0; j < units[i].kps.length; j++) out.push(units[i].kps[j]);
      }
      return out;
    },
    levelName: function (n) { return syll().levels[n] || "基础"; },
    questionById: function (qid) {
      var b = bank();
      for (var kp in b) {
        var arr = b[kp];
        for (var i = 0; i < arr.length; i++) if (arr[i].id === qid) return { q: arr[i], kpId: kp };
      }
      return null;
    },
    questionsOf: function (kpId) { return bank()[kpId] || []; },
    /* 同难度备选题，用于“换一题” */
    alternatives: function (level, excludeIds) {
      var out = [], b = bank();
      for (var kp in b) {
        var arr = b[kp];
        for (var i = 0; i < arr.length; i++) {
          if (arr[i].level === level && excludeIds.indexOf(arr[i].id) === -1) {
            out.push({ q: arr[i], kpId: kp });
          }
        }
      }
      return out;
    }
  };

  var Analyze = {
    counts: function (student) {
      var c = { mastered: 0, fuzzy: 0, weak: 0 };
      for (var k in student.mastery) if (c[student.mastery[k]] !== undefined) c[student.mastery[k]]++;
      return c;
    },
    /* 按薄弱程度排序的知识点列表，用于备课推荐 */
    priorityKps: function (student) {
      var idx = KB.kpIndex(), out = [];
      for (var id in student.mastery) {
        if (!idx[id]) continue;
        out.push({ id: id, kp: idx[id].kp, unit: idx[id].unit, status: student.mastery[id] });
      }
      out.sort(function (a, b) {
        var d = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
        if (d !== 0) return d;
        return a.kp.level - b.kp.level;
      });
      return out;
    },
    weakPoints: function (student, limit) {
      var list = Analyze.priorityKps(student).filter(function (x) { return x.status !== "mastered"; });
      return list.slice(0, limit || 5);
    },
    /* 历史做题正确率趋势 */
    history: function (student) {
      return (student.lessons || []).map(function (l) {
        var total = 0, score = 0;
        for (var qid in l.results) {
          total++; score += RESULT_WEIGHT[l.results[qid]] || 0;
        }
        return { date: l.date, rate: total ? Math.round((score / total) * 100) : 0, total: total, note: l.note };
      });
    },
    /* 某个知识点在历史练习中的表现 */
    kpHistory: function (student, kpId) {
      var wrong = 0, total = 0;
      (student.lessons || []).forEach(function (l) {
        for (var qid in l.results) {
          if (qid.indexOf(kpId) === 0) {
            total++;
            if (l.results[qid] !== "ok") wrong++;
          }
        }
      });
      return { total: total, wrong: wrong };
    }
  };

  window.KBStore = Store;
  window.KBStuSession = StuSession;
  window.KBHomework = Homework;
  window.KBTeacher = Teacher;
  window.KBData = KB;
  window.KBAnalyze = Analyze;
  window.KBStatus = STATUS;
  window.KBResultWeight = RESULT_WEIGHT;

  /* 启动时确保演示账号与示例数据存在（同时迁移旧版无账号数据） */
  try { Teacher.ensureDemo(); } catch (e) {}
})();

</script>
<script>
/* 生成引擎：备课包生成 + 课后学情分析与家长反馈生成
 * 演示版使用「知识点数据 + 题库 + 规则模板」离线生成，保证内容可解释、无幻觉；
 * 正式版把 generatePlan / buildFeedback 换成调用大模型即可，上层页面无需改动。
 */
(function () {
  "use strict";

  var D = window.KBData, A = window.KBAnalyze;

  function pick(kpId, level, used) {
    var arr = D.questionsOf(kpId);
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].level === level && used.indexOf(arr[i].id) === -1) return arr[i];
    }
    return null;
  }

  function goalFor(kp) {
    var lv = D.levelName(kp.level);
    return "能正确运用「" + kp.name + "」解决" + lv + "类问题，重点规避：" + kp.errors.join("、") + "。";
  }

  /* 生成备课包 */
  function generatePlan(student, kpIds) {
    var idx = D.kpIndex(), used = [];
    var sections = [], goals = [];

    kpIds.forEach(function (id) {
      var item = idx[id];
      if (!item) return;
      var kp = item.kp, status = student.mastery[id] || "fuzzy";
      goals.push(goalFor(kp));

      var qs = [];
      [1, 2, 3].forEach(function (lv) {
        var q = pick(id, lv, used);
        if (q) { used.push(q.id); qs.push({ q: q, extra: false }); }
      });

      /* 薄弱知识点额外补一道基础题 */
      if (status === "weak") {
        var alts = D.alternatives(1, used);
        if (alts.length) {
          var extra = alts[Math.floor(Math.random() * alts.length)];
          used.push(extra.q.id);
          qs.push({ q: extra.q, extra: true, from: idx[extra.kpId] ? idx[extra.kpId].kp.name : "" });
        }
      }

    var hist = A.kpHistory(student, id);
    hist.recent = ((student.kpLog || {})[id] || []).slice();
    sections.push({
        kpId: id,
        kpName: kp.name,
        unitName: item.unit.name,
        levelName: D.levelName(kp.level),
        tip: kp.tip,
        errors: kp.errors,
        status: status,
        history: hist,
        recent: hist.recent,
        questions: qs
      });
    });

    return {
      studentId: student.id,
      kpIds: kpIds,
      createdAt: new Date().toISOString().slice(0, 10),
      goals: goals,
      sections: sections,
      questionCount: used.length,
      notice: "本备课包由系统依据学情档案自动生成，教师可在下方编辑、换题后使用。"
    };
  }

  /* 换一题：同难度随机替换 */
  function swapQuestion(plan, sectionIdx, qIdx) {
    var sec = plan.sections[sectionIdx];
    var target = sec.questions[qIdx];
    if (!target) return null;
    var usedIds = [];
    plan.sections.forEach(function (s) { s.questions.forEach(function (x) { usedIds.push(x.q.id); }); });
    var alts = D.alternatives(target.q.level, usedIds);
    if (!alts.length) return null;
    var next = alts[Math.floor(Math.random() * alts.length)];
    target.q = next.q;
    if (next.kpId !== sec.kpId) target.from = "（选自：" + (D.kpIndex()[next.kpId] || {}).kp.name + "）";
    else target.from = "";
    return target;
  }

  /* 课后反馈生成 */
  function buildFeedback(student, plan, results) {
    var idx = D.kpIndex();
    var total = 0, ok = 0, partial = 0, wrong = 0;
    var weak = [], good = [], errorTags = {};

    plan.sections.forEach(function (s) {
      var kpWrong = 0, kpTotal = 0;
      s.questions.forEach(function (item) {
        var r = results[item.q.id];
        if (!r) return;
        total++; kpTotal++;
        if (r === "ok") ok++;
        else if (r === "partial") { partial++; kpWrong += 0.5; }
        else { wrong++; kpWrong++; errorTags[item.q.errorTag] = (errorTags[item.q.errorTag] || 0) + 1; }
      });
      if (kpTotal > 0 && kpWrong / kpTotal >= 0.5) weak.push(s.kpName);
      else if (kpTotal > 0 && kpWrong === 0) good.push(s.kpName);
    });

    var rate = total ? Math.round(((ok + partial * 0.5) / total) * 100) : 0;
    var topErrors = Object.keys(errorTags).sort(function (a, b) { return errorTags[b] - errorTags[a]; }).slice(0, 3);

    var summary = "本次课共练习 " + total + " 题，答对 " + ok + " 题、半对 " + partial + " 题、错误 " + wrong +
      " 题，综合正确率 " + rate + "%。" +
      (good.length ? "已掌握：" + good.join("、") + "。" : "") +
      (weak.length ? "仍需巩固：" + weak.join("、") + "。" : "");

    var suggestion = [];
    if (weak.length) suggestion.push("下次课优先复习：" + weak.join("、"));
    if (topErrors.length) suggestion.push("重点纠正错误类型：" + topErrors.join("、"));
    if (rate >= 80) suggestion.push("可提升难度，加入变式题进行拓展");
    else if (rate < 50) suggestion.push("降低难度，先补足基础题再进入进阶练习");

    var kpNames = plan.sections.map(function (s) { return s.kpName; }).join("、");
    var parent = {
      encourage: "家长您好！" + student.name + "今天上课状态不错，我们一起完成了「" + kpNames + "」的练习。" +
        (good.length ? "其中" + good.join("、") + "掌握得很好，" : "") +
        "综合正确率 " + rate + "%。" +
        (weak.length ? "「" + weak.join("、") + "」还需要再巩固，建议本周在家每天做 2~3 道同类型题，做完后让孩子讲一遍思路。" : "整体掌握扎实，可以适当做几道变式题练练手。") +
        "有情况随时联系我。",
      neutral: "家长您好，反馈一下本次课情况。上课内容：" + kpNames + "。课堂练习 " + total + " 题，正确率 " + rate + "%。" +
        (good.length ? "已掌握：" + good.join("、") + "。" : "") +
        (weak.length ? "仍需巩固：" + weak.join("、") + "。" : "") +
        (topErrors.length ? "主要错误类型：" + topErrors.join("、") + "。" : "") +
        "下次课安排：" + (suggestion[0] || "按原计划推进") + "。",
      attention: "家长您好，有几点需要您配合关注。" + student.name + "在「" + (weak.join("、") || kpNames) +
        "」这部分掌握还不牢固，本次正确率 " + rate + "%。" +
        (topErrors.length ? "主要问题是：" + topErrors.join("、") + "。" : "") +
        "建议本周固定时间做 10 分钟同类练习，做题时让孩子边做边说思路，不要只看答案。我们下次课会先回顾这部分，辛苦您配合。"
    };

    return {
      rate: rate, total: total, ok: ok, partial: partial, wrong: wrong,
      good: good, weak: weak, topErrors: topErrors,
      summary: summary, suggestions: suggestion, parent: parent
    };
  }

  /* 单次课的表现评级：good=达到掌握水平 / mid=一般 / bad=薄弱表现 */
  function gradeOf(ratio) {
    return ratio >= 0.6 ? "bad" : (ratio < 0.25 ? "good" : "mid");
  }

  /* 近三次综合判定：
   * 只有 1 次记录 → 直接采纳本次表现；
   * 最近 3 次里有 2 次以上做到「好」 → 掌握；有 2 次以上「差」 → 薄弱；否则模糊。
   * 教学依据：单次课表现有偶然性，看最近三次更能反映当前真实水平。
   */
  function decideStatus(log) {
    var recent = log.slice(-3);
    if (!recent.length) return null;
    if (recent.length === 1) {
      var g0 = gradeOf(recent[0].ratio);
      return g0 === "bad" ? "weak" : (g0 === "good" ? "mastered" : "fuzzy");
    }
    var good = 0, bad = 0;
    recent.forEach(function (r) {
      var g = gradeOf(r.ratio);
      if (g === "good") good++; else if (g === "bad") bad++;
    });
    if (bad >= 2) return "weak";
    if (good >= 2) return "mastered";
    return "fuzzy";
  }

  /* 把本次结果写回学情档案 */
  function applyResults(student, plan, results) {
    var today = new Date().toISOString().slice(0, 10);
    student.kpLog = student.kpLog || {};
    var changed = [];

    plan.sections.forEach(function (s) {
      var total = 0, wrong = 0;
      s.questions.forEach(function (item) {
        var r = results[item.q.id];
        if (!r) return;
        total++;
        if (r === "wrong") wrong += 1;
        else if (r === "partial") wrong += 0.5;
      });
      if (!total) return;

      var ratio = wrong / total;
      var log = student.kpLog[s.kpId] || [];
      log.push({ date: today, ratio: Math.round(ratio * 100) / 100 });
      if (log.length > 3) log = log.slice(-3);
      student.kpLog[s.kpId] = log;

      var before = student.mastery[s.kpId];
      var next = decideStatus(log);
      student.mastery[s.kpId] = next;
      if (before !== next) changed.push({ kpId: s.kpId, from: before, to: next });
    });

    var lesson = {
      id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date: today,
      kpIds: plan.kpIds,
      results: results,
      note: "",
      summary: ""
    };
    student.lessons = student.lessons || [];
    student.lessons.push(lesson);
    return { lesson: lesson, changed: changed };
  }

  window.KBEngine = {
    generatePlan: generatePlan,
    swapQuestion: swapQuestion,
    buildFeedback: buildFeedback,
    applyResults: applyResults
  };
})();

</script>
<script>
/* 课堂互动小游戏：闯关夺星 + 错题复仇
 * ---------------------------------------------------------------
 * 设计约束（答辩时要讲的三件事）：
 *   1. 不新增数据结构：题目直接取自本次备课包（闯关）与学生历史错题（复仇），
 *      复用题库已有的 stem / answer / solution / errorTag 字段。
 *   2. 游戏即记录：判定结果实时写入课堂记录的 results，玩完游戏下面的
 *      掌握/半会/不会已经勾好，老师不再需要课后逐题回忆勾选——是减负不是加负。
 *   3. 学情闭环可见：错题复仇的题目来自该学生历史「不会/半会」记录，
 *      历史薄弱点直接变成下一节课的关卡，数据不是存着看的。
 * 判定方式两种：老师判定（旁听打分）/ 学生自评（先自评，再揭晓答案核对）。
 */
(function () {
  "use strict";

  var D = window.KBData;

  var STAGE_NAME = ["小试身手", "乘胜追击", "终极挑战"];
  var STAGE_DESC = ["基础题热身，先把信心立起来", "进阶题，连对会有连击奖励", "变式题，拿下就能冲满星"];
  var OK_WORDS = ["答对了，很稳！", "正确，继续保持", "漂亮，这一步没掉坑", "很棒，思路很清楚"];
  var PART_WORDS = ["思路是对的，但没做完", "会一半，差最后一步", "方向对了，细节还差一点"];
  var BAD_WORDS = ["这题掉坑了，看一眼易错点", "没关系，这题本来就是坎", "先记下来，下节课再拿下它"];

  /* 游戏运行时状态：挂在模块内，页面重渲染不丢失 */
  var G = {
    mode: null,        // "run" | "boss"
    judge: "teacher",  // "teacher" | "self"
    stages: [], stage: 0, idx: 0,
    boss: [],
    answers: {},       // qid -> "ok" | "partial" | "wrong"
    combo: 0, best: 0,
    revealed: false,
    banner: "",
    last: null,        // { val, text }
    finished: false,
    summary: null,
    host: null, api: null,
    planRef: null, stuRef: null
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }
  function lvName(n) { return D.levelName ? D.levelName(n) : "基础"; }

  /* ---------- 关卡构建 ---------- */

  /* 闯关夺星：把备课包里的题按难度分成三关 */
  function buildStages(plan) {
    var stages = [];
    [1, 2, 3].forEach(function (lv) {
      var qs = [];
      plan.sections.forEach(function (s) {
        s.questions.forEach(function (it) {
          if (it.q.level === lv) qs.push({ q: it.q, kpId: s.kpId, kpName: s.kpName });
        });
      });
      if (qs.length) {
        stages.push({
          level: lv,
          name: STAGE_NAME[lv - 1],
          desc: STAGE_DESC[lv - 1],
          questions: qs
        });
      }
    });
    return stages;
  }

  /* 错题复仇：从学生历史课堂记录里捞出「不会 / 半会」的题，包装成 Boss */
  function buildBoss(student, plan) {
    var inPlan = {};
    (plan ? plan.sections : []).forEach(function (s) {
      s.questions.forEach(function (it) { inPlan[it.q.id] = 1; });
    });
    var map = {}, order = [];
    (student.lessons || []).forEach(function (l) {
      var rs = l.results || {};
      Object.keys(rs).forEach(function (qid) {
        var v = rs[qid];
        if (v !== "wrong" && v !== "partial") return;
        if (inPlan[qid]) return;                 /* 本次备课包里已经有了，不重复出现 */
        var f = D.questionById(qid);
        if (!f) return;
        var idx = D.kpIndex()[f.kpId];
        var item = map[qid];
        /* 同一道题多次出错，保留最近一次的状态与日期 */
        if (!item) {
          item = map[qid] = {
            q: f.q, kpId: f.kpId,
            kpName: idx ? idx.kp.name : "",
            date: l.date, last: v, hp: 2, max: 2
          };
          order.push(qid);
        } else {
          if (l.date > item.date) { item.date = l.date; item.last = v; }
          if (v === "wrong") item.last = "wrong";
        }
      });
    });
    var arr = order.map(function (k) { return map[k]; });
    arr.sort(function (a, b) {
      if ((a.last === "wrong") !== (b.last === "wrong")) return a.last === "wrong" ? -1 : 1;
      return a.date < b.date ? 1 : -1;
    });
    return arr.slice(0, 6);
  }

  function bossList() { return G.boss || []; }
  function bossKilled() {
    var n = 0;
    bossList().forEach(function (b) { if (b.hp === 0) n++; });
    return n;
  }

  /* ---------- 流程控制 ---------- */

  function reset() {
    G.mode = null; G.stages = []; G.stage = 0; G.idx = 0; G.boss = [];
    G.answers = {}; G.combo = 0; G.best = 0;
    G.revealed = false; G.banner = ""; G.last = null;
    G.finished = false; G.summary = null;
  }

  function start(mode) {
    G.mode = mode;
    G.stage = 0; G.idx = 0; G.answers = {}; G.combo = 0; G.best = 0;
    G.revealed = false; G.last = null; G.finished = false; G.summary = null;
    if (mode === "run") {
      G.stages = buildStages(G.api.plan);
      G.boss = [];
      G.banner = "第 1 关 · " + (G.stages[0] ? G.stages[0].name : "");
    } else {
      G.stages = [];
      /* 学生端没有备课包概念，错题要全部算进来（bossIgnorePlan） */
      G.boss = buildBoss(G.api.student, G.api.bossIgnorePlan ? null : G.api.plan);
      G.boss.forEach(function (b) { b.hp = b.max; });
      G.banner = G.boss.length ? "错题复仇 · " + G.boss.length + " 只错题怪来袭" : "";
    }
  }

  function cur() {
    if (G.mode === "boss") {
      var b = G.boss[G.idx];
      return b ? { q: b.q, kpName: b.kpName, date: b.date, last: b.last } : null;
    }
    var s = G.stages[G.stage];
    if (!s) return null;
    var it = s.questions[G.idx];
    return it ? { q: it.q, kpName: it.kpName } : null;
  }

  function totalQ() {
    if (G.mode === "boss") return G.boss.length;
    var n = 0;
    G.stages.forEach(function (s) { n += s.questions.length; });
    return n;
  }
  function doneQ() {
    if (G.mode === "boss") return G.idx;
    var n = 0;
    for (var i = 0; i < G.stage; i++) n += G.stages[i].questions.length;
    return n + G.idx;
  }

  function count() {
    var ok = 0, p = 0, w = 0;
    Object.keys(G.answers).forEach(function (k) {
      var v = G.answers[k];
      if (v === "ok") ok++; else if (v === "partial") p++; else w++;
    });
    return { ok: ok, partial: p, wrong: w, total: ok + p + w };
  }

  function answer(val) {
    var item = cur();
    if (!item) return;
    G.answers[item.q.id] = val;
    if (G.api && G.api.onUpdate) G.api.onUpdate(item.q.id, val);
    if (val === "ok") { G.combo++; if (G.combo > G.best) G.best = G.combo; }
    else G.combo = 0;
    if (G.mode === "boss" && G.boss[G.idx]) {
      G.boss[G.idx].hp = val === "ok" ? 0 : (val === "partial" ? 1 : 2);
    }
    G.revealed = true;
    G.last = { val: val, text: fbText(item, val) };
    draw();
  }

  function fbText(item, val) {
    var q = item.q;
    if (val === "ok") {
      var t = rnd(OK_WORDS);
      if (G.combo >= 3) t += "　连对 " + G.combo + " 题，手感来了！";
      return t;
    }
    if (val === "partial") return rnd(PART_WORDS) + "。正确答案：" + q.answer;
    return rnd(BAD_WORDS) + "。易错点：" + (q.errorTag || "注意审题");
  }

  function next() {
    G.revealed = false; G.last = null; G.banner = "";
    if (G.mode === "boss") {
      if (G.idx < G.boss.length - 1) { G.idx++; draw(); return; }
      finish(); return;
    }
    var s = G.stages[G.stage];
    if (s && G.idx < s.questions.length - 1) { G.idx++; draw(); return; }
    if (G.stage < G.stages.length - 1) {
      G.stage++; G.idx = 0;
      G.banner = "第 " + (G.stage + 1) + " 关 · " + G.stages[G.stage].name;
      draw(); return;
    }
    finish();
  }

  function finish() {
    var c = count();
    var rate = c.total ? Math.round(((c.ok + c.partial * 0.5) / c.total) * 100) : 0;
    G.summary = {
      ok: c.ok, partial: c.partial, wrong: c.wrong, total: c.total, rate: rate,
      star: rate >= 85 ? 3 : (rate >= 60 ? 2 : 1),
      best: G.best,
      killed: G.mode === "boss" ? bossKilled() : 0,
      bossTotal: G.mode === "boss" ? G.boss.length : 0,
      mode: G.mode
    };
    G.finished = true;
    /* 交回页面层：写回课堂记录并整体重绘（重绘后由 mount 呈现结算页） */
    if (G.api && G.api.onFinish) G.api.onFinish();
    else draw();
  }

  /* ---------- 渲染 ---------- */

  function mount(host, api) {
    G.host = host; G.api = api;
    if (!host) return;
    /* 学生端强制走「学生自评」：自己做完自己评，老师端才有老师判定 */
    if (api.forceJudge) G.judge = api.forceJudge;
    /* 换了学生或重新生成了备课包，游戏进度作废 */
    if (G.planRef !== api.plan || G.stuRef !== api.student) {
      G.planRef = api.plan; G.stuRef = api.student;
      reset();
    }
    draw();
  }

  function draw() {
    if (!G.host) return;
    G.host.innerHTML = G.finished ? resultHtml() : (G.mode ? playHtml() : entryHtml());
    bind();
    /* 每帧把已记录数量同步到页面，供演示时对照 */
    var live = G.host.querySelector("[data-live]");
    if (live) {
      var c = count();
      live.textContent = "已记录 " + c.total + " 题（答对 " + c.ok + " · 半会 " + c.partial + " · 不会 " + c.wrong + "）";
    }
  }

  function bind() {
    if (!G.host) return;
    var nodes = G.host.querySelectorAll("[data-act]");
    Array.prototype.forEach.call(nodes, function (b) {
      b.onclick = function () { act(b.getAttribute("data-act"), b.getAttribute("data-val")); };
    });
  }

  function act(a, val) {
    if (a === "start") { start(val); draw(); return; }
    if (a === "judge") { G.judge = val; draw(); return; }
    if (a === "answer") { answer(val); return; }
    if (a === "next") { next(); return; }
    if (a === "again") { var m = G.summary ? G.summary.mode : "run"; reset(); start(m); draw(); return; }
    if (a === "quit" || a === "close") { reset(); draw(); return; }
  }

  /* 入口页 */
  function entryHtml() {
    var plan = G.api.plan, stu = G.api.student;
    var boss = buildBoss(stu, plan);
    var stages = buildStages(plan);
    var qn = 0;
    stages.forEach(function (s) { qn += s.questions.length; });

    var h = '<div class="card game-card"><div class="row-between"><h2>课堂互动 · 小游戏</h2>' +
      '<span class="tag">' + tagText() + '</span></div>' +
      '<p class="muted small">' + (G.api.studentMode
        ? '题目来自你最近一次课的知识点和历史错题。自评结果只作为练习记录，不计入老师的学情档案。'
        : '题目直接来自本次备课包与学生历史错题，判定完即写回学情档案，不用课后再补一遍勾选。') + '</p>';

    if (!G.api.hideJudge) {
      h += '<div class="gm judge"><span class="gm-label">判定方式</span>' +
        judgeBtn("teacher", "老师判定", "学生口答或纸笔作答，老师在旁打分") +
        judgeBtn("self", "学生自评", "先不公布答案，学生自报会/不会，再揭晓核对") +
        '</div>';
    }

    h += '<div class="gm-entry">';
    h += '<div class="ge-card run">' +
      '<div class="ge-ico">★</div>' +
      '<div class="ge-t">闯关夺星</div>' +
      '<div class="ge-d">' + (qn ? '把本次备课包的 ' + qn + ' 道题分成 ' + stages.length + ' 关：' +
        stages.map(function (s) { return s.name; }).join(' → ') : '本次备课包暂无题目') + '</div>' +
      (qn ? '<button class="weui-btn weui-btn_primary weui-btn_mini" data-act="start" data-val="run">开始闯关</button>'
          : '<button class="weui-btn weui-btn_default weui-btn_mini" disabled>暂无题目</button>') +
      '</div>';

    h += '<div class="ge-card boss' + (boss.length ? '' : ' off') + '">' +
      '<div class="ge-ico">⚔</div>' +
      '<div class="ge-t">错题复仇</div>' +
      '<div class="ge-d">' + (boss.length
        ? '调出' + (G.api.studentMode ? '你' : stu.name) + '历史标记为不会/半会的 ' + boss.length + ' 道题，这次能消灭几只？'
        : '暂无历史错题。先上一节课积累课堂记录，下次课就有复仇关卡了。') + '</div>' +
      (boss.length ? '<button class="weui-btn weui-btn_primary weui-btn_mini" data-act="start" data-val="boss">开始复仇</button>'
        : '<button class="weui-btn weui-btn_default weui-btn_mini" disabled>暂无错题</button>') +
      '</div>';
    h += '</div>';

    if (boss.length) {
      h += '<div class="boss-preview"><div class="muted small">错题怪清单</div><div class="chips">';
      boss.forEach(function (b) {
        h += '<span class="chip ' + (b.last === "wrong" ? "weak" : "fuzzy") + '">' + esc(b.kpName) + ' · ' + esc(b.date) + '</span>';
      });
      h += '</div></div>';
    }
    h += '</div>';
    return h;
  }

  function judgeBtn(key, label, desc) {
    var on = G.judge === key;
    return '<button class="gj' + (on ? " on" : "") + '" data-act="judge" data-val="' + key + '">' +
      '<strong>' + label + '</strong><span>' + desc + '</span></button>';
  }

  /* ��戏进行中 */
  function playHtml() {
    var item = cur();
    if (!item) return '<div class="card game-card"><p class="muted">没有可用题目。</p></div>';
    var isBoss = G.mode === "boss";
    var q = item.q;
    var self = G.judge === "self";
    var n = doneQ() + 1, tot = totalQ();

    var h = '<div class="card game-card">';
    h += '<div class="gtop"><button class="chip-btn" data-act="quit">退出</button>' +
      '<div class="gtitle">' + (isBoss ? '错题复仇' : ('第 ' + (G.stage + 1) + ' 关 · ' + esc(G.stages[G.stage].name))) + '</div>' +
      '<div class="gmode-tag">' + (self ? '学生自评' : '老师判定') + '</div></div>';

    h += '<div class="gbar"><span style="width:' + Math.round((n - 1) / tot * 100) + '%"></span></div>' +
      '<div class="muted small">第 ' + n + ' / ' + tot + ' 题' +
      (G.combo >= 2 ? '　·　连对 ' + G.combo + ' 题' : '') + '</div>';

    if (isBoss) {
      h += '<div class="boss-list">';
      G.boss.forEach(function (b, i) {
        var st = b.hp === 0 ? "已消灭" : (b.hp === 1 ? "残血" : "待挑战");
        h += '<div class="boss-item' + (i === G.idx ? " cur" : "") + (b.hp === 0 ? " dead" : "") + '">' +
          '<div class="bn">' + (i + 1) + '. ' + esc(b.kpName) + '</div>' +
          '<div class="hp"><span style="width:' + (b.hp / b.max * 100) + '%"></span></div>' +
          '<div class="bs">' + st + '</div></div>';
      });
      h += '</div>';
    }

    if (G.banner) h += '<div class="gbanner">' + esc(G.banner) + '</div>';

    h += '<div class="gq">' +
      '<div class="gq-meta">' + esc(item.kpName || "") +
      (isBoss && item.date ? '　·　上次错于 ' + esc(item.date) : '') +
      '　·　' + lvName(q.level) + '</div>' +
      '<div class="stem">' + esc(q.stem) + '</div>';

    if (!G.revealed) {
      h += '<div class="gjudge">';
      if (self) {
        h += '<p class="muted small">先不公布答案——学生做完之后自己选：</p>' +
          ansBtn("ok", "我会做") + ansBtn("partial", "有点卡") + ansBtn("wrong", "不会做");
      } else {
        h += '<p class="muted small">学生作答后，老师在旁判定：</p>' +
          ansBtn("ok", "答对") + ansBtn("partial", "半对") + ansBtn("wrong", "答错");
      }
      h += '</div>';
    } else {
      h += '<div class="greveal ' + (G.last && G.last.val === "ok" ? "ok" : (G.last && G.last.val === "partial" ? "mid" : "bad")) + '">' +
        '<div class="gr-fb">' + esc(G.last ? G.last.text : "") + '</div>' +
        '<div><strong>正确答案：</strong>' + esc(q.answer) + '</div>' +
        '<div class="muted"><strong>解析：</strong>' + esc(q.solution) + '</div>' +
        (q.errorTag ? '<div class="muted small"><strong>易错点：</strong>' + esc(q.errorTag) + '</div>' : '') +
        '<div class="gr-mark">' + (G.api.studentMode ? '自评：' : '记为：') + markText(G.answers[q.id]) +
        (self ? '　<span class="muted small">（' + (G.api.studentMode ? '自评只作练习记录，不写入学情档案' : '学生自评，老师可更正') + '）</span>' : '') + '</div>';
      if (self && !G.api.studentMode) {
        h += '<div class="gfix">' +
          '<span class="muted small">老师更正：</span>' +
          '<button class="chip-btn" data-act="answer" data-val="ok">掌握</button>' +
          '<button class="chip-btn" data-act="answer" data-val="partial">半会</button>' +
          '<button class="chip-btn" data-act="answer" data-val="wrong">不会</button>' +
          '</div>';
      }
      h += '</div>';
      h += '<div class="actions"><button class="weui-btn weui-btn_primary" data-act="next">' +
        (n >= tot ? '完成挑战' : '下一题') + '</button></div>';
    }
    h += '</div>';

    h += '<div class="gfoot"><span data-live></span>' +
      '<span class="gstars">' + starsHtml(count()) + '</span></div>';
    h += '</div>';
    return h;
  }

  function ansBtn(val, label) {
    var cls = val === "ok" ? "ok" : (val === "partial" ? "mid" : "bad");
    return '<button class="gans ' + cls + '" data-act="answer" data-val="' + val + '">' + label + '</button>';
  }
  function markText(v) {
    return v === "ok" ? "掌握" : (v === "partial" ? "半会" : (v === "wrong" ? "不会" : "—"));
  }

  function starsHtml(c) {
    var got = c.ok + c.partial * 0.5;
    var full = Math.floor(got), half = got - full >= 0.5;
    var s = "";
    for (var i = 0; i < 3; i++) {
      s += '<i class="st ' + (i < full ? "on" : (i === full && half ? "half" : "")) + '">★</i>';
    }
    return s;
  }

  /* 结算页 */
  function resultHtml() {
    var s = G.summary || { ok: 0, partial: 0, wrong: 0, total: 0, rate: 0, star: 1, best: 0, killed: 0, bossTotal: 0, mode: "run" };
    var isBoss = s.mode === "boss";
    var words = s.star === 3 ? "太稳了，这节课可以直接加难度" :
      (s.star === 2 ? "整体不错，把半会的那几题再过一遍" : "别急，基础题先吃透，下次再来");

    var h = '<div class="card game-card"><div class="row-between"><h2>' +
      (isBoss ? '错题复仇 · 结算' : '闯关夺星 · 结算') + '</h2>' +
      '<span class="tag">' + tagText() + '</span></div>';

    h += '<div class="gresult"><div class="gr-stars">' + bigStars(s.star) + '</div>' +
      '<div class="gr-rate">' + s.rate + '%</div>' +
      '<div class="muted small">' + words + '</div></div>';

    h += '<div class="stat-row">' +
      stat("答对", s.ok, "ok") + stat("半会", s.partial, "mid") + stat("不会", s.wrong, "bad") +
      (isBoss ? stat("消灭", s.killed + "/" + s.bossTotal, s.killed === s.bossTotal ? "ok" : "mid") : stat("最高连对", s.best, "ok")) +
      '</div>';

    if (G.api.studentMode) {
      h += '<div class="tip"><strong>这是练习记录：</strong>自评结果保存在本机，不写进老师的学情档案——' +
        '正式的成绩只由老师课堂判定产生，避免学生自己打分把学情数据带偏。</div>';
      if (s.wrong || s.partial) {
        h += '<div class="tip warn"><strong>还没拿下的题：</strong>可以去「作业任务」里再练一遍，' +
          '老师下次备课也会优先照顾这些知识点。</div>';
      }
    } else {
      h += '<div class="tip"><strong>课堂记录已自动勾选：</strong>下方每题的掌握 / 半会 / 不会已按本次判定填好，' +
        '老师扫一眼微调即可点「保存并生成课后反馈」。</div>';
      if (isBoss) {
        h += '<div class="tip warn"><strong>复仇结果怎么用：</strong>本次消灭的错题会从下节课的复仇清单里移除；' +
          '没消灭的会继续留在薄弱清单里，并影响下次备课的推荐顺序。</div>';
      }
    }

    h += '<div class="actions">' +
      '<button class="weui-btn weui-btn_primary" data-act="again">再来一局</button>' +
      '<button class="weui-btn weui-btn_default" data-act="close">收起</button></div>';
    h += '</div>';
    return h;
  }

  /* 顶部徽标文案：老师端强调写入记录，学生端强调只作练习 */
  function tagText() {
    return G.api && G.api.studentMode ? "自评练习 · 不写入学情档案" : "游戏结果自动填入下方课堂记录";
  }

  function bigStars(n) {
    var s = "";
    for (var i = 0; i < 3; i++) s += '<i class="bst' + (i < n ? " on" : "") + '">★</i>';
    return s;
  }
  function stat(label, num, cls) {
    return '<div class="stat ' + cls + '"><div class="stat-num">' + num + '</div><div class="stat-label">' + label + '</div></div>';
  }

  window.KBGame = { mount: mount, reset: reset };
})();

</script>
<script>
/* 学生端工作台：课堂互动 / 课后记录 / 作业任务
 * ---------------------------------------------------------------
 * 与老师端共用同一份学生数据（kexiaobang.students.v2.<老师id>），只是换个视角看：
 *   课堂互动 —— 复用 KBGame，强制「学生自评」，结果只留在本地不写回学情；
 *   课后记录 —— 直接展示老师保存的 lessons，数据不需要任何转换；
 *   作业任务 —— 取最近一次课里标为「半会 / 不会」的题自动生成，老师无需额外布置。
 * 作业完成状态存在独立分区 kexiaobang.homework.v1.<老师id>.<学生id>，
 * 属于练习记录，不参与学情计算——正式成绩只由老师课堂判定产生。
 */
(function () {
  "use strict";

  var S = window.KBStore, D = window.KBData, HW = window.KBHomework;
  var FALLBACK_KEY = "math-g4b";

  var ST = {
    tab: "play",
    teacherId: null, studentId: null,
    student: null,        /* 缓存同一个对象引用，避免游戏模块误判为“换人”而重置进度 */
    practicePlan: null,   /* 练习包只存在于内存，不落盘、不影响老师端 */
    playResults: {},      /* 自评结果，本地留存 */
    onLogout: null
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function toast(msg) {
    var t = $("toast");
    if (!t) return;
    t.textContent = msg;
    t.className = "toast show";
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.className = "toast"; }, 2600);
  }
  function lessonsDesc(stu) {
    return (stu.lessons || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }
  function stat(label, num, cls) {
    return '<div class="stat ' + cls + '"><div class="stat-num">' + num + '</div><div class="stat-label">' + label + '</div></div>';
  }

  /* ---------- 进入 / 退出 ---------- */

  function boot(teacherId, studentId, onLogout) {
    ST.teacherId = teacherId; ST.studentId = studentId; ST.onLogout = onLogout;
    ST.student = S.getOf(teacherId, studentId);
    if (!ST.student) { if (onLogout) onLogout(); return; }
    /* 切到该学生所用教材，题库索引随之切换 */
    if (window.KB_Syllabus) window.KB_Syllabus.setCurrent(ST.student.syllabus || FALLBACK_KEY);

    ST.practicePlan = null; ST.playResults = {}; ST.tab = "play";
    if (window.KBGame) window.KBGame.reset();

    $("login-view").style.display = "none";
    $("app-shell").style.display = "none";
    $("student-shell").style.display = "";
    $("stu-name").textContent = ST.student.name;
    $("stu-sub").textContent = "课堂互动 · 课后记录 · 作业任务";
    $("btn-stu-logout").onclick = logout;
    ["play", "records", "homework"].forEach(function (t) {
      var b = $("stab-" + t);
      if (b) b.onclick = function () { setTab(t); };
    });
    setTab("play");
  }

  function logout() {
    if (window.KBStuSession) window.KBStuSession.clear();
    if (window.KBGame) window.KBGame.reset();
    $("student-shell").style.display = "none";
    if (ST.onLogout) ST.onLogout();
  }

  function setTab(t) {
    ST.tab = t;
    ["play", "records", "homework"].forEach(function (x) {
      var b = $("stab-" + x), v = $("sview-" + x);
      if (b) b.className = "tab" + (x === t ? " active" : "");
      if (v) v.style.display = x === t ? "block" : "none";
    });
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  function render() {
    if (ST.tab === "records") renderRecords();
    else if (ST.tab === "homework") renderHomework();
    else renderPlay();
  }

  /* ---------- 课堂互动 ---------- */

  /* 练习包：优先最近一次课的知识点，其次薄弱知识点，最后兜底取有题的知识点。
   * 只在内存里，不写入任何存储。 */
  function buildPracticePlan(stu) {
    if (ST.practicePlan) return ST.practicePlan;
    var idx = D.kpIndex(), kpIds = [];
    var lessons = lessonsDesc(stu);
    if (lessons.length && lessons[0].kpIds && lessons[0].kpIds.length) {
      kpIds = lessons[0].kpIds.slice(0, 3);
    }
    if (!kpIds.length) {
      var m = stu.mastery || {};
      Object.keys(m).forEach(function (id) {
        if (kpIds.length < 3 && (m[id] === "weak" || m[id] === "fuzzy") && idx[id]) kpIds.push(id);
      });
    }
    if (!kpIds.length) {
      var all = D.allKps ? D.allKps() : [];
      for (var i = 0; i < all.length && kpIds.length < 3; i++) {
        if (D.questionsOf(all[i].id).length) kpIds.push(all[i].id);
      }
    }
    var sections = [];
    kpIds.forEach(function (id) {
      var item = idx[id];
      if (!item) return;
      var qs = [];
      [1, 2, 3].forEach(function (lv) {
        var arr = D.questionsOf(id);
        for (var i = 0; i < arr.length; i++) {
          if (arr[i].level === lv) { qs.push({ q: arr[i] }); break; }
        }
      });
      if (qs.length) sections.push({ kpId: id, kpName: item.kp.name, unitName: item.unit.name, questions: qs });
    });
    ST.practicePlan = sections.length ? { kpIds: sections.map(function (s) { return s.kpId; }), sections: sections } : null;
    return ST.practicePlan;
  }

  function renderPlay() {
    var stu = ST.student, plan = buildPracticePlan(stu);
    var host = $("sview-play");
    var html = '<div id="stu-game-host"></div>';
    html += '<div class="card"><h2>怎么用</h2>' +
      '<p class="muted small">闯关夺星练的是你最近一次课的知识点，错题复仇打的是你自己历史上的错题怪。' +
      '做完先自己选「我会做 / 有点卡 / 不会做」，然后才会揭晓答案和解析。</p>' +
      '<div class="tip"><strong>自评不计入成绩：</strong>这里的结果只保存在你自己的设备上，' +
      '不会写进老师的学情档案——老师看到的掌握情况，仍然以上课时的判定为准。</div></div>';
    host.innerHTML = html;

    var g = $("stu-game-host");
    if (window.KBGame && g && plan) {
      window.KBGame.mount(g, {
        plan: plan,
        student: stu,
        results: ST.playResults,
        studentMode: true,      /* 文案切换：强调是练习记录 */
        hideJudge: true,        /* 学生端不显示判定方式切换 */
        forceJudge: "self",     /* 强制学生自评 */
        bossIgnorePlan: true,   /* 学生没有备课包，历史错题全部算进来 */
        onUpdate: function (qid, val) { ST.playResults[qid] = val; },
        onFinish: function () { renderPlay(); }
      });
    } else if (g) {
      g.innerHTML = '<div class="card"><p class="muted">暂无可练习的题目。</p></div>';
    }
  }

  /* ---------- 课后记录 ---------- */

  /* 课次正确率序列（时间正序：旧 → 新），与老师端趋势图同一算法 */
  function historyOf(stu) {
    return (stu.lessons || []).map(function (l) {
      var c = { ok: 0, partial: 0, wrong: 0 };
      Object.keys(l.results || {}).forEach(function (k) {
        if (c[l.results[k]] !== undefined) c[l.results[k]]++;
      });
      var total = c.ok + c.partial + c.wrong;
      return { date: l.date, rate: total ? Math.round(((c.ok + c.partial * 0.5) / total) * 100) : 0, total: total };
    }).sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
  }

  /* 正确率折线图：内联 SVG，复用老师端同一套 .chart 样式（渐变 id 加 Stu 后缀避免重复） */
  function trendChart(his) {
    var n = his.length;
    var pts = his.map(function (h, i) {
      return { x: n === 1 ? 50 : (i / (n - 1)) * 100, y: (1 - h.rate / 100) * 100, h: h };
    });
    var line = pts.map(function (p, i) {
      return (i ? "L" : "M") + p.x.toFixed(2) + " " + p.y.toFixed(2);
    }).join(" ");
    var area = line + " L" + pts[n - 1].x.toFixed(2) + " 100 L" + pts[0].x.toFixed(2) + " 100 Z";
    var grid = [0, 50, 100].map(function (v) {
      return '<line x1="0" y1="' + v + '" x2="100" y2="' + v +
        '" stroke="#E6EBF1" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    }).join("");
    var dots = pts.map(function (p, i) {
      var cls = i === 0 ? " first" : (i === n - 1 ? " last" : "");
      return '<span class="chart-dot" style="left:' + p.x.toFixed(2) + '%;top:' + p.y.toFixed(2) + '%"></span>' +
        '<span class="chart-val' + cls + '" style="left:' + p.x.toFixed(2) + '%;top:' + p.y.toFixed(2) + '%">' + p.h.rate + '%</span>' +
        '<span class="chart-date' + cls + '" style="left:' + p.x.toFixed(2) + '%">' + esc(String(p.h.date).slice(5)) + '</span>';
    }).join("");

    return '<div class="chart">' +
      '<div class="chart-y"><span>100%</span><span>50%</span><span>0%</span></div>' +
      '<div class="chart-plot">' +
        '<svg class="chart-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
          '<defs><linearGradient id="trendFillStu" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="#7DA9D9" stop-opacity=".22"/>' +
            '<stop offset="100%" stop-color="#7DA9D9" stop-opacity="0"/>' +
          '</linearGradient></defs>' + grid +
          '<path d="' + area + '" fill="url(#trendFillStu)"/>' +
          '<path d="' + line + '" fill="none" stroke="#7DA9D9" stroke-width="2.5" ' +
            'vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
        '</svg>' + dots +
      '</div></div>';
  }

  function renderRecords() {
    var stu = ST.student, idx = D.kpIndex();
    var lessons = lessonsDesc(stu);
    var html = "";

    /* 先看整体趋势，再看每次课的明细 */
    if (lessons.length) {
      var his = historyOf(stu);
      var rates = his.map(function (h) { return h.rate; });
      var first = rates[0], lastR = rates[rates.length - 1];
      var best = Math.max.apply(null, rates);
      var avg = Math.round(rates.reduce(function (a, b) { return a + b; }, 0) / rates.length);
      var diff = lastR - first;
      var verdict, cls;
      if (his.length < 2) {
        verdict = "目前只有 1 次课的记录，再上几次课这里就会出现你的进步曲线。";
        cls = "mid";
      } else if (diff > 5) {
        verdict = "从第 1 次的 " + first + "% 提升到最近一次的 " + lastR + "%，进步了 " + diff + " 个百分点，继续保持！";
        cls = "ok";
      } else if (diff < -5) {
        verdict = "最近一次 " + lastR + "% 比第一次低了 " + Math.abs(diff) + " 个百分点，这几块要多练练。";
        cls = "bad";
      } else {
        verdict = "成绩稳定在 " + avg + "% 左右，冲一冲就能再上一个台阶。";
        cls = "mid";
      }
      html += '<div class="card"><h2>我的进步曲线</h2>' +
        '<p class="muted small">每次课的正确率变化。用的就是老师课堂记录里那份数据，两端看到的完全一致。</p>' +
        '<div class="stat-row">' + stat("上课次数", his.length, "") + stat("平均正确率", avg + "%", cls) +
        stat("最好一次", best + "%", "ok") + '</div>';
      if (his.length >= 2) {
        html += trendChart(his) + '<div class="tip"><strong>' + verdict + '</strong></div>';
      } else {
        html += '<p class="muted small">' + verdict + '</p>';
      }
      html += '</div>';
    }

    html += '<div class="card"><h2>我的上课记录</h2>';
    if (!lessons.length) {
      html += '<p class="muted">还没有上课记录。老师上完课并在「课堂记录」里保存之后，' +
        '这里会列出每次学的内容和老师的备注。</p>';
    } else {
      html += '<p class="muted small">这份数据和老师端看到的是同一份——老师课上勾选并保存，你这边立刻就能看到。</p>';
      html += '<div class="lesson-list">';
      lessons.forEach(function (l) {
        var names = (l.kpIds || []).map(function (id) {
          return idx[id] ? idx[id].kp.name : id;
        }).join("、");
        var c = { ok: 0, partial: 0, wrong: 0 };
        Object.keys(l.results || {}).forEach(function (k) {
          if (c[l.results[k]] !== undefined) c[l.results[k]]++;
        });
        var total = c.ok + c.partial + c.wrong;
        var rate = total ? Math.round(((c.ok + c.partial * 0.5) / total) * 100) : 0;
        html += '<div class="lesson-row">' +
          '<div class="lesson-date">' + esc(String(l.date).slice(5)) + '</div>' +
          '<div class="lesson-kps">' + esc(names || "—") +
          '<small>答对 ' + c.ok + ' · 半会 ' + c.partial + ' · 不会 ' + c.wrong +
          (l.note ? '　|　老师备注：' + esc(l.note) : '') + '</small></div>' +
          '<div class="lesson-rate">' + esc(l.summary || ("正确率 " + rate + "%")) + '</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    $("sview-records").innerHTML = html;
  }

  /* ---------- 作业任务 ---------- */

  function renderHomework() {
    var stu = ST.student, idx = D.kpIndex();
    var lessons = lessonsDesc(stu);
    var last = lessons[0];
    var host = $("sview-homework");
    var html = '<div class="card"><h2>本次作业</h2>';

    if (!last) {
      html += '<p class="muted">还没有作业。上完第一节课后，老师课上标为「半会 / 不会」的题会自动出现在这里。</p>';
    } else {
      var items = [];
      Object.keys(last.results || {}).forEach(function (qid) {
        var v = last.results[qid];
        if (v !== "partial" && v !== "wrong") return;
        var f = D.questionById(qid);
        if (!f) return;
        items.push({ q: f.q, kpName: idx[f.kpId] ? idx[f.kpId].kp.name : "", val: v });
      });

      if (!items.length) {
        html += '<p class="muted">' + esc(last.date) + ' 那次课全部答对了，这次没有需要重做的题。<br>' +
          '想练手可以去「课堂互动」玩闯关夺星。</p>';
      } else {
        var done = HW.get(ST.teacherId, ST.studentId);
        var n = 0;
        items.forEach(function (x) { if (done[x.q.id]) n++; });
        html += '<p class="muted small">来自 ' + esc(last.date) + ' 的课堂记录：课上被标为「半会 / 不会」的题，' +
          '自动变成这次的作业——老师不用另外布置。</p>';
        html += '<div class="stat-row">' + stat("作业题数", items.length, "mid") + stat("已完成", n, "ok") + '</div>';
        html += '<ul class="qlist">';
        items.forEach(function (x, i) {
          var on = !!done[x.q.id];
          html += '<li class="qitem">' +
            '<div class="row-between"><span class="qtag">' + esc(x.kpName) + '</span>' +
            '<span class="tag ' + (x.val === "wrong" ? "weak" : "fuzzy") + '">' + (x.val === "wrong" ? "不会" : "半会") + '</span></div>' +
            '<div class="stem">' + (i + 1) + '. ' + esc(x.q.stem) + '</div>' +
            '<div class="muted small">' + (x.val === "wrong" ? "照着解析重做一遍" : "先讲一遍思路再做") + '</div>' +
            '<div class="qans" id="hw-ans-' + i + '" style="display:none">' +
            '<div><strong>答案：</strong>' + esc(x.q.answer) + '</div>' +
            '<div class="muted"><strong>解析：</strong>' + esc(x.q.solution) + '</div></div>' +
            '<div class="qbtns">' +
            '<button class="weui-btn weui-btn_default weui-btn_mini" data-hwans="' + i + '">查看解析</button>' +
            '<button class="weui-btn weui-btn_mini weui-btn_' + (on ? "primary" : "default") + '" data-hw="' + esc(x.q.id) + '">' +
            (on ? "已完成，点我撤销" : "我完成了") + '</button>' +
            '</div></li>';
        });
        html += '</ul>';
        if (n === items.length) html += '<div class="tip"><strong>全部完成了：</strong>下次课老师会重新考这几道题，加油。</div>';
        html += '<div class="tip warn"><strong>打勾只是练习记录：</strong>存在你自己的设备上，' +
          '不会写进学情档案；老师看到的掌握情况仍以课堂判定为准。</div>';
      }
    }
    html += '</div>';
    host.innerHTML = html;

    Array.prototype.forEach.call(host.querySelectorAll("[data-hw]"), function (b) {
      b.onclick = function () {
        var qid = b.getAttribute("data-hw");
        var cur = HW.get(ST.teacherId, ST.studentId)[qid];
        HW.mark(ST.teacherId, ST.studentId, qid, !cur);
        if (!cur) toast("已标记完成");
        renderHomework();
      };
    });
    Array.prototype.forEach.call(host.querySelectorAll("[data-hwans]"), function (b) {
      b.onclick = function () {
        var box = $("hw-ans-" + b.getAttribute("data-hwans"));
        var show = box.style.display === "none";
        box.style.display = show ? "block" : "none";
        b.textContent = show ? "收起解析" : "查看解析";
      };
    });
  }

  window.KBStudent = { boot: boot, logout: logout, render: render };
})();

</script>
<script>
/* 界面逻辑：学生档案 → 智能备课 → 课堂记录 → 课后反馈 */
(function () {
  "use strict";

  var S = window.KBStore, D = window.KBData, A = window.KBAnalyze, E = window.KBEngine;
  var T = window.KBTeacher;
  var STATUS = window.KBStatus;

  var state = {
    tab: "students",
    studentId: null,
    selected: [],
    selectedInit: false,
    plan: null,
    results: {},
    feedback: null,
    tone: "encourage",
    saved: false,
    changes: [],
    showAdd: false,
    confirmDel: false,
    draft: { name: "", grade: "小学四年级", unit: 0, traits: "" }
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  /* 取当前学生，同时把数据层切到该学生所用教材 */
  function student() {
    var s = state.studentId ? S.get(state.studentId) : null;
    if (s && window.KB_Syllabus) window.KB_Syllabus.setCurrent(s.syllabus || FALLBACK_KEY);
    return s;
  }

  function toast(msg) {
    var t = $("toast");
    if (!t) return;
    t.textContent = msg;
    t.className = "toast show";
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.className = "toast"; }, 2600);
  }

  /* 空状态引导卡：任何一步都能点开，但会告诉你先做什么 */
  function guideCard(title, desc, btnText, target) {
    return '<div class="card empty"><h2>' + title + '</h2>' +
      '<p class="muted">' + desc + '</p>' +
      '<div class="actions"><button class="weui-btn weui-btn_primary" data-go="' + target + '">' + btnText + '</button></div></div>';
  }

  function bindGo() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) {
      b.onclick = function () { setTab(b.getAttribute("data-go")); };
    });
  }

  function tabReady(t) {
    if (t === "plan") return !!state.studentId;
    if (t === "record") return !!state.plan;
    if (t === "feedback") return !!state.feedback;
    return true;
  }

  /* ---------- 登录（一期为身份标识，不是安全认证） ---------- */
  function loginHtml() {
    var others = T.all().filter(function (t) { return !t.demo; });
    var h = '<div class="login-card">' +
      '<div class="login-brand"><div class="logo">课</div>' +
      '<h1>课小帮</h1>' +
      '<p class="muted small">一对一家教 · 备课 → 授课 → 学情 → 家校反馈</p></div>' +
      '<div class="form-row"><label for="login-name">老师姓名</label>' +
      '<input id="login-name" class="weui-input" type="text" maxlength="12" placeholder="例如：张老师"></div>' +
      '<div class="actions"><button class="weui-btn weui-btn_primary" id="btn-login">进入工作台</button></div>' +
      '<p class="muted small">输入姓名即可进入，同名视为同一位老师。</p>' +
      '<div class="login-sep"><span>或</span></div>' +
      '<button class="weui-btn weui-btn_default" id="btn-demo">使用演示账号（含示例学生与学情）</button>';
    if (others.length) {
      h += '<div class="login-accounts"><p class="muted small">本机已有账号（点选直接进入）</p><div class="chips">';
      others.forEach(function (t) {
        h += '<button class="chip-btn" data-acc="' + t.id + '">' + esc(t.name) + '</button>';
      });
      h += '</div></div>';
    }
    /* 学生入口：列出本机全部学生（跨老师账号），点名字直接进入学生工作台 */
    h += '<div class="login-sep"><span>我是学生</span></div>';
    var stus = S.allAcrossTeachers ? S.allAcrossTeachers() : [];
    if (!stus.length) {
      h += '<p class="muted small">本机还没有学生档案，先用老师账号添加学生。</p>';
    } else {
      h += '<div class="stu-list">';
      stus.forEach(function (x) {
        h += '<button class="stu-item" data-stu="' + esc(x.teacherId) + '|' + esc(x.student.id) + '">' +
