<style>
/* 课小帮 · 定制样式（动森风皮肤）
 * 基础组件（按钮 / 列表 / 徽标 / 表单）来自 WeUI 2.6.26（Tencent，MIT 协议）
 * 本文件只负责布局、业务组件与主题外观，不重复实现 WeUI 已有能力。
 * 主题：奶油底色 + 木色描边 + 手绘不规则圆角 + 贴纸式投影
 */
:root {
  --brand: #62b96a;
  --brand-dark: #4a9553;
  --brand-soft: #e9f6e6;
  --text: #4a3728;
  --text-sub: #97806a;
  --border: #e3cfae;
  --ink: #7a5c3e;
  --paper: #fffdf7;
  --paper-2: #fbf4e6;
  --ok: #5cbf8a;
  --ok-soft: #e7f6ee;
  --mid: #f0b34a;
  --mid-soft: #fdf3df;
  --bad: #ef8a7a;
  --bad-soft: #fdeeeb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: #fdf6e9;
  background-image: radial-gradient(#eadfc8 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.6;
}

/* 顶栏 */
.top {
  background: var(--paper);
  border-bottom: 2.5px dashed var(--border);
  position: sticky; top: 0; z-index: 10;
}
.top-inner {
  max-width: 900px; margin: 0 auto; padding: 18px 20px 10px;
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; flex-wrap: wrap;
}
h1 { font-size: 21px; font-weight: 500; margin: 0; letter-spacing: 1px; color: var(--ink); }
h2 { font-size: 16px; font-weight: 500; margin: 0 0 12px; color: var(--ink); }
h3 { font-size: 14px; font-weight: 500; margin: 20px 0 8px; color: var(--text-sub); }
.sub { color: var(--text-sub); font-size: 13px; margin: 4px 0 0; }
.top-right { text-align: right; }
.cur { display: block; color: var(--text-sub); font-size: 12px; margin-bottom: 8px; }

.tabs { max-width: 900px; margin: 0 auto; padding: 0 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  background: var(--paper-2);
  border: 2px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 16px 18px 14px 20px / 18px 14px 20px 16px;
  padding: 8px 16px; font-size: 14px; color: var(--text-sub); cursor: pointer;
  font-family: inherit; margin-bottom: 6px;
}
.tab.active {
  color: #fff; background: var(--brand); border-color: var(--brand-dark); font-weight: 500;
  box-shadow: 0 2px 0 rgba(74, 92, 62, 0.25);
}
.tab.locked { opacity: 0.5; }
.tab.locked.active { opacity: 1; }

.wrap { max-width: 900px; margin: 0 auto; padding: 16px 20px 8px; }
.foot {
  max-width: 900px; margin: 16px auto 40px; padding: 0 20px;
  color: var(--text-sub); font-size: 12px; line-height: 1.7;
}

/* 卡片：手绘描边 + 贴纸投影 */
.card {
  background: var(--paper); border: 2.5px solid var(--border);
  border-radius: 22px 26px 20px 24px / 24px 20px 26px 22px;
  padding: 18px; margin-bottom: 16px;
  box-shadow: 0 3px 0 rgba(122, 92, 62, 0.12);
}
/* 用 minmax(0, ·) 防止长内容把列撑破；880px 起收成单列，避免中间宽度太挤 */
.grid {
  display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
  gap: 16px; align-items: start;
}
.grid > * { min-width: 0; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) {
  .wrap, .top-inner, .foot { padding-left: 14px; padding-right: 14px; }
  .card { padding: 14px; }
  .trend-date { width: 64px; }
  .stat { min-width: 68px; }
  h1 { font-size: 19px; }
}

.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.muted { color: var(--text-sub); }
.small { font-size: 12px; }

/* 学生列表：使用 WeUI cells，这里套手绘外框 */
.list-head {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  flex-wrap: wrap; margin-top: 6px;
}
.list-head .weui-cells__title { margin: 0; padding: 0; }

/* 添加学生表单 */
.add-form { margin-top: 10px; }
.add-form h3 { margin: 0 0 10px; }
.form-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
}
.form-row label {
  flex: 0 0 72px; font-size: 13px; color: var(--text-sub);
}
.form-row .weui-input {
  flex: 1 1 180px; min-width: 0; height: 38px; padding: 0 10px;
  font-size: 14px; color: var(--text); background: var(--paper);
  border: 2px solid var(--border); border-radius: 12px;
}
.form-row .weui-input:focus { outline: none; border-color: var(--brand); }

.stu-list {
  margin-top: 4px;
  border: 2.5px solid var(--border);
  border-radius: 20px 24px 18px 22px / 22px 18px 24px 20px;
  overflow: hidden;
  box-shadow: 0 3px 0 rgba(122, 92, 62, 0.12);
}
.stu-item { cursor: pointer; }
.stu-item:hover { background: var(--paper-2); }
.stu-item.active { background: var(--brand-soft); }
.stu-name { font-size: 16px; font-weight: 500; margin: 0 0 4px; color: var(--text); }
.bar {
  display: flex; height: 9px; margin: 8px 0 4px;
  border-radius: 999px; overflow: hidden; background: #f0e6d2;
  border: 1.5px solid var(--border);
}
.seg { display: block; height: 100%; }
.seg.ok { background: var(--ok); }
.seg.mid { background: var(--mid); }
.seg.bad { background: var(--bad); }

/* 统计 */
.stat-row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.stat {
  flex: 1; min-width: 80px; text-align: center;
  border-radius: 18px 20px 16px 22px / 20px 16px 22px 18px;
  padding: 12px 8px; background: var(--paper-2);
  border: 2px solid var(--border);
}
.stat.ok { background: var(--ok-soft); color: #3d9166; border-color: #b6e3c9; }
.stat.mid { background: var(--mid-soft); color: #b57d1d; border-color: #f2dca6; }
.stat.bad { background: var(--bad-soft); color: #d1604f; border-color: #f6c8bf; }
.stat-num { font-size: 22px; font-weight: 500; }
.stat-label { font-size: 12px; }

/* 标签 */
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0; }
.chip {
  border-radius: 999px; padding: 4px 12px; font-size: 12px;
  background: var(--paper-2); border: 1.5px solid var(--border);
}
.chip.weak { background: var(--bad-soft); color: #d1604f; border-color: #f6c8bf; }
.chip.fuzzy { background: var(--mid-soft); color: #b57d1d; border-color: #f2dca6; }
.chip.mastered { background: var(--ok-soft); color: #3d9166; border-color: #b6e3c9; }

.chip-btn {
  border: 2px solid var(--border); background: var(--paper); border-radius: 999px;
  padding: 6px 14px; font-size: 12px; cursor: pointer; color: var(--text);
  font-family: inherit; line-height: 1.4;
  box-shadow: 0 2px 0 rgba(122, 92, 62, 0.14);
}
.chip-btn em { font-style: normal; color: var(--text-sub); font-size: 11px; }
.chip-btn.weak { border-color: #f3bfb4; }
.chip-btn.fuzzy { border-color: #f0d49a; }
.chip-btn.mastered { border-color: #b3dfc4; }
.chip-btn.on { background: var(--brand); color: #fff; border-color: var(--brand-dark); }
.chip-btn.on em { color: rgba(255, 255, 255, 0.85); }

.unit { margin: 12px 0; }
.unit-name { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
.more { margin-top: 12px; }
.more summary { cursor: pointer; font-size: 13px; color: var(--brand-dark); }

/* 趋势 */
.trend { margin: 8px 0; }
.trend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.trend-date { font-size: 12px; color: var(--text-sub); width: 84px; }
.trend-bar {
  flex: 1; height: 10px; background: #f0e6d2;
  border-radius: 999px; overflow: hidden; border: 1.5px solid var(--border);
}
.trend-bar span { display: block; height: 100%; background: var(--brand); }
.trend-val { font-size: 12px; width: 40px; text-align: right; }

/* 备课包 */
.section { border-top: 2px dashed var(--border); padding-top: 14px; margin-top: 14px; }
.tag {
  font-size: 12px; padding: 2px 10px; border-radius: 999px;
  background: var(--paper-2); border: 1.5px solid var(--border);
}
.tag.weak { background: var(--bad-soft); color: #d1604f; border-color: #f6c8bf; }
.tag.fuzzy { background: var(--mid-soft); color: #b57d1d; border-color: #f2dca6; }
.tag.mastered { background: var(--ok-soft); color: #3d9166; border-color: #b6e3c9; }
.tip {
  background: var(--brand-soft); border: 2px solid #b3dfc4;
  border-radius: 14px 18px 12px 16px / 16px 12px 18px 14px;
  padding: 9px 12px; font-size: 13px; margin: 8px 0;
}
.tip.warn { background: var(--mid-soft); border-color: #f2dca6; }
.goals { margin: 4px 0; padding-left: 20px; font-size: 13px; }
.goals li { margin-bottom: 4px; }

/* 题目 */
.qlist { list-style: none; margin: 8px 0; padding: 0; }
.qitem {
  border: 2.5px solid var(--border);
  border-radius: 18px 22px 16px 20px / 20px 16px 22px 18px;
  padding: 12px; margin-bottom: 10px; background: var(--paper);
}
.qtag {
  font-size: 11px; color: #3d9166; background: var(--brand-soft);
  padding: 2px 10px; border-radius: 999px; border: 1.5px solid #b3dfc4;
}
.stem { margin: 8px 0; font-size: 15px; overflow-wrap: anywhere; }
.qans {
  background: var(--paper-2); border: 2px dashed var(--border);
  border-radius: 14px; padding: 10px; font-size: 13px; margin: 8px 0;
  overflow-wrap: anywhere;
}
.qbtns, .mark { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* 按钮：统一成手绘药丸，覆盖 WeUI 的方角绿底 */
/* WeUI 默认 min-width:184px + 左右 auto 外边距，窄屏撑不下去会横向溢出导致整体位移，这里统一解除 */
.wrap .weui-btn, .top-right .weui-btn {
  display: inline-block; min-width: 0; max-width: 100%;
  width: auto; margin-left: 0; margin-right: 0;
}
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.actions .weui-btn,
.qbtns .weui-btn,
.mark .weui-btn,
.tones .weui-btn {
  min-width: 0; width: auto; margin: 0;
  border-radius: 999px !important;
  border: 2px solid var(--border) !important;
  background: var(--paper) !important;
  color: var(--ink) !important;
  box-shadow: 0 2px 0 rgba(122, 92, 62, 0.16);
  font-family: inherit;
}
.actions .weui-btn_primary,
.qbtns .weui-btn_primary,
.tones .weui-btn_primary {
  background: var(--brand) !important;
  border-color: var(--brand-dark) !important;
  color: #fff !important;
}
.weui-btn_primary:not(.weui-btn_disabled):active,
.actions .weui-btn_primary:active {
  background: var(--brand-dark) !important;
}
.actions .weui-btn { padding: 10px 20px; font-size: 15px; }
.top-right .weui-btn {
  margin: 0; border-radius: 999px !important;
  border: 2px solid var(--border) !important;
  background: var(--paper) !important; color: var(--ink) !important;
}

<script>
/* 教材（学科 + 年级 + 册次）索引层
 * ── 为什么要有这一层 ──
 * 知识点体系按「学科 / 年级 / 册次 / 版本」解耦存放，页面与生成引擎只面向「当前教材」取数。
 * 这样新增一个年级时，只需按下面的 schema 再注册一份数据，其余代码一行都不用改。
 *
 * ── 扩展一份新教材的做法 ──
 *   1. 新建 data/knowledge/syllabus-<学科>-<年级><册次>.js，例如 syllabus-math-g5a.js
 *   2. 文件末尾写：window.KB_Syllabus.register({ key:"math-g5a", subject:"数学",
 *        grade:"小学五年级", term:"上册", textbook:"人教版", levels:{...}, units:[...], questions:{...} })
 *   3. 在 index.html 里加一行 <script src="...">
 *   4. 在 app.js 的 GRADE_SYLLABUS 里加一条 年级 → key 的映射
 * 知识点 schema：{ id, name, level:1|2|3, tip, errors:[...] }
 * 题目   schema：{ id, level, stem, answer, solution, errorTag }
 */
(function () {
  "use strict";

  var registry = {};
  var DEFAULT_KEY = "math-g4b";

  var Syllabus = {
    register: function (item) {
      if (!item || !item.key) return;
      registry[item.key] = item;
    },
    keys: function () { return Object.keys(registry); },
    /* 供界面展示的教材清单 */
    list: function () {
      return Object.keys(registry).map(function (k) {
        var s = registry[k];
        return {
          key: k,
          label: s.subject + " · " + s.grade + s.term + "（" + s.textbook + "）",
          subject: s.subject, grade: s.grade, term: s.term, textbook: s.textbook
        };
      });
    },
    get: function (key) { return registry[key] || null; },
    has: function (key) { return !!registry[key]; },
    defaultKey: function () { return DEFAULT_KEY; },
    currentKey: DEFAULT_KEY,
    setCurrent: function (key) {
      if (registry[key]) Syllabus.currentKey = key;
      else Syllabus.currentKey = DEFAULT_KEY;
    },
    current: function () { return registry[Syllabus.currentKey] || registry[DEFAULT_KEY]; },
    /* 教材未接入时用于界面提示 */
    labelOf: function (key) {
      var s = registry[key] || registry[DEFAULT_KEY];
      return s.subject + " · " + s.grade + s.term + "（" + s.textbook + "）";
    }
  };

  /* 注册已接入的教材：人教版四年级下册数学（数据见 knowledge-math-g4.js / question-bank.js） */
  Syllabus.register({
    key: DEFAULT_KEY,
    subject: window.KB_KNOWLEDGE.subject,
    grade: "小学四年级",
    term: window.KB_KNOWLEDGE.term,
    textbook: window.KB_KNOWLEDGE.version,
    levels: window.KB_KNOWLEDGE.levels,
    units: window.KB_KNOWLEDGE.units,
    questions: window.KB_QUESTIONS
  });

  window.KB_Syllabus = Syllabus;
})();

</script>
<script>
/* 数据层：本地存储 + 知识点/题库索引 + 学情统计
 * 一期使用浏览器 localStorage，二期可替换为云数据库，接口保持不变。
 */
(function () {
  "use strict";

  /* 存储分区：
   *   老师账号表   kexiaobang.teachers.v1
   *   当前登录态   kexiaobang.session.v1
   *   学生数据     kexiaobang.students.v2.<teacherId>   ← 按老师隔离
   * 二期接云数据库时，只需把 "<teacherId>" 换成查询条件，接口不变。
   */
  var TEACHER_KEY = "kexiaobang.teachers.v1";
  var SESSION_KEY = "kexiaobang.session.v1";
  var STUDENTS_PREFIX = "kexiaobang.students.v2.";
  var LEGACY_KEY = "kexiaobang.students.v1";
  var DEMO_ID = "t-demo";

  var STATUS = { mastered: "掌握", fuzzy: "模糊", weak: "薄弱" };
  var STATUS_ORDER = ["weak", "fuzzy", "mastered"];
  var RESULT_WEIGHT = { ok: 1, partial: 0.5, wrong: 0 };

  function readJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function writeJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function uid(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* ---------- 老师账号 ----------
   * 一期定位：身份标识，用于区分不同老师的学生档案，不是安全认证。
   * 不校验密码；同名（去除首尾空格后完全相同）视为同一账号。
   * 二期接微信登录 / 账号密码后，替换本模块即可，其余代码不用动。
   */
  var Teacher = {
    all: function () { return readJSON(TEACHER_KEY, []); },
    save: function (list) { writeJSON(TEACHER_KEY, list); },
    get: function (id) {
      var list = Teacher.all();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    },
    currentId: function () {
      try { return localStorage.getItem(SESSION_KEY) || null; } catch (e) { return null; }
    },
    current: function () {
      var id = Teacher.currentId();
      return id ? Teacher.get(id) : null;
    },
    findByName: function (name) {
      var list = Teacher.all(), key = String(name || "").trim();
      for (var i = 0; i < list.length; i++) if (list[i].name === key) return list[i];
      return null;
    },
    /* 输入姓名进入：已存在则登入，否则创建新账号（学生档案为空） */
    enter: function (name) {
      var key = String(name || "").trim();
      if (!key) return { error: "请输入姓名" };
      var exist = Teacher.findByName(key);
      if (exist) {
        try { localStorage.setItem(SESSION_KEY, exist.id); } catch (e) {}
        return { teacher: exist, created: false };
      }
      var t = {
        id: uid("t"),
        name: key,
        demo: false,
        createdAt: new Date().toISOString().slice(0, 10)
      };
      var list = Teacher.all();
      list.push(t);
      Teacher.save(list);
      try { localStorage.setItem(SESSION_KEY, t.id); } catch (e) {}
      return { teacher: t, created: true };
    },
    login: function (id) {
      try { localStorage.setItem(SESSION_KEY, id); } catch (e) {}
    },
    logout: function () {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    },
    /* 演示账号：自带 3 位学生与累计学情，用于现场展示闭环 */
    ensureDemo: function () {
      var list = Teacher.all(), demo = null;
      for (var i = 0; i < list.length; i++) if (list[i].id === DEMO_ID) demo = list[i];
      if (!demo) {
        demo = { id: DEMO_ID, name: "林老师", demo: true, createdAt: new Date().toISOString().slice(0, 10) };
        list.unshift(demo);
        Teacher.save(list);
      }
      var key = STUDENTS_PREFIX + DEMO_ID;
      /* 旧版本（无账号体系）的数据直接迁移给演示账号，避免用户已有记录丢失 */
      var legacy = null;
      try { legacy = localStorage.getItem(LEGACY_KEY); } catch (e) {}
      if (legacy && !localStorage.getItem(key)) {
        try {
          localStorage.setItem(key, legacy);
          localStorage.removeItem(LEGACY_KEY);
        } catch (e) {}
      }
      if (!localStorage.getItem(key)) {
        writeJSON(key, window.KB_SAMPLE_STUDENTS || []);
      }
      return demo;
    }
  };

  function studentsKey() {
    var t = Teacher.current();
    return STUDENTS_PREFIX + (t ? t.id : "guest");
  }

  var Store = {
    all: function () {
      var key = studentsKey(), t = Teacher.current();
      var raw = null;
      try { raw = localStorage.getItem(key); } catch (e) {}
      if (raw) {
        try { return JSON.parse(raw); } catch (e) {}
      }
      /* 首次进入该账号：演示账号带示例学生，其他账号从空档案开始 */
      var seed = (t && t.demo) ? (window.KB_SAMPLE_STUDENTS || []) : [];
      writeJSON(key, seed);
      return JSON.parse(JSON.stringify(seed));
    },
    saveAll: function (list) {
      writeJSON(studentsKey(), list);
    },
    get: function (id) {
      var list = Store.all();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    },
    update: function (student) {
      var list = Store.all();
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === student.id) { list[i] = student; break; }
      }
      Store.saveAll(list);
    },
    /* 加随机后缀，避免同一毫秒内连续添加产生重复 id */
    newId: function () {
      var id;
      do {
        id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      } while (Store.get(id));
      return id;
    },
    add: function (student) {
      var list = Store.all();
      list.push(student);
      Store.saveAll(list);
      return student;
    },
    remove: function (id) {
      var list = Store.all();
      var next = [];
      for (var i = 0; i < list.length; i++) if (list[i].id !== id) next.push(list[i]);
      Store.saveAll(next);
    },
    reset: function () {
      try { localStorage.removeItem(studentsKey()); } catch (e) {}
    },
    /* 当前账号下的学生数，用于登录页展示 */
    count: function () {
      var key = studentsKey(), raw = null;
      try { raw = localStorage.getItem(key); } catch (e) {}
      if (!raw) return 0;
      try { return JSON.parse(raw).length; } catch (e) { return 0; }
    }
  };

  /* 当前教材：新增年级只需注册新 syllabus，这里无需改动 */
  function syll() {
    return (window.KB_Syllabus && window.KB_Syllabus.current()) || window.KB_KNOWLEDGE;
  }
  function bank() {
    return syll().questions || window.KB_QUESTIONS;
  }

  var KB = {
    /* 当前教材元信息，用于界面显示 */
    meta: function () { return syll(); },
    units: function () { return syll().units; },
    kpIndex: function () {
      var map = {};
      var units = syll().units;
      for (var i = 0; i < units.length; i++) {
        for (var j = 0; j < units[i].kps.length; j++) {
          var kp = units[i].kps[j];
          map[kp.id] = { kp: kp, unit: units[i] };
        }
      }
      return map;
    },
    allKps: function () {
      var out = [], units = syll().units;
      for (var i = 0; i < units.length; i++) {
        for (var j = 0; j < units[i].kps.length; j++) out.push(units[i].kps[j]);
      }
      return out;
    },
    levelName: function (n) { return syll().levels[n] || "基础"; },
    questionById: function (qid) {
      var b = bank();
      for (var kp in b) {
        var arr = b[kp];
        for (var i = 0; i < arr.length; i++) if (arr[i].id === qid) return { q: arr[i], kpId: kp };
      }
      return null;
    },
    questionsOf: function (kpId) { return bank()[kpId] || []; },
    /* 同难度备选题，用于“换一题” */
    alternatives: function (level, excludeIds) {
      var out = [], b = bank();
      for (var kp in b) {
        var arr = b[kp];
        for (var i = 0; i < arr.length; i++) {
          if (arr[i].level === level && excludeIds.indexOf(arr[i].id) === -1) {
            out.push({ q: arr[i], kpId: kp });
          }
        }
      }
      return out;
    }
  };

  var Analyze = {
    counts: function (student) {
      var c = { mastered: 0, fuzzy: 0, weak: 0 };
      for (var k in student.mastery) if (c[student.mastery[k]] !== undefined) c[student.mastery[k]]++;
      return c;
    },
    /* 按薄弱程度排序的知识点列表，用于备课推荐 */
    priorityKps: function (student) {
      var idx = KB.kpIndex(), out = [];
      for (var id in student.mastery) {
        if (!idx[id]) continue;
        out.push({ id: id, kp: idx[id].kp, unit: idx[id].unit, status: student.mastery[id] });
      }
      out.sort(function (a, b) {
        var d = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
        if (d !== 0) return d;
        return a.kp.level - b.kp.level;
      });
      return out;
    },
    weakPoints: function (student, limit) {
      var list = Analyze.priorityKps(student).filter(function (x) { return x.status !== "mastered"; });
      return list.slice(0, limit || 5);
    },
    /* 历史做题正确率趋势 */
    history: function (student) {
      return (student.lessons || []).map(function (l) {
        var total = 0, score = 0;
        for (var qid in l.results) {
          total++; score += RESULT_WEIGHT[l.results[qid]] || 0;
        }
        return { date: l.date, rate: total ? Math.round((score / total) * 100) : 0, total: total, note: l.note };
      });
    },
    /* 某个知识点在历史练习中的表现 */
    kpHistory: function (student, kpId) {
      var wrong = 0, total = 0;
      (student.lessons || []).forEach(function (l) {
        for (var qid in l.results) {
          if (qid.indexOf(kpId) === 0) {
            total++;
            if (l.results[qid] !== "ok") wrong++;
          }
        }
      });
      return { total: total, wrong: wrong };
    }
  };

  window.KBStore = Store;
  window.KBTeacher = Teacher;
  window.KBData = KB;
  window.KBAnalyze = Analyze;
  window.KBStatus = STATUS;
  window.KBResultWeight = RESULT_WEIGHT;

  /* 启动时确保演示账号与示例数据存在（同时迁移旧版无账号数据） */
  try { Teacher.ensureDemo(); } catch (e) {}
})();

</script>
<script>
/* 生成引擎：备课包生成 + 课后学情分析与家长反馈生成
 * 演示版使用「知识点数据 + 题库 + 规则模板」离线生成，保证内容可解释、无幻觉；
 * 正式版把 generatePlan / buildFeedback 换成调用大模型即可，上层页面无需改动。
 */
(function () {
  "use strict";

  var D = window.KBData, A = window.KBAnalyze;

  function pick(kpId, level, used) {
    var arr = D.questionsOf(kpId);
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].level === level && used.indexOf(arr[i].id) === -1) return arr[i];
    }
    return null;
  }

  function goalFor(kp) {
    var lv = D.levelName(kp.level);
    return "能正确运用「" + kp.name + "」解决" + lv + "类问题，重点规避：" + kp.errors.join("、") + "。";
  }

  /* 生成备课包 */
  function generatePlan(student, kpIds) {
    var idx = D.kpIndex(), used = [];
    var sections = [], goals = [];

    kpIds.forEach(function (id) {
      var item = idx[id];
      if (!item) return;
      var kp = item.kp, status = student.mastery[id] || "fuzzy";
      goals.push(goalFor(kp));

      var qs = [];
      [1, 2, 3].forEach(function (lv) {
        var q = pick(id, lv, used);
        if (q) { used.push(q.id); qs.push({ q: q, extra: false }); }
      });

      /* 薄弱知识点额外补一道基础题 */
      if (status === "weak") {
        var alts = D.alternatives(1, used);
        if (alts.length) {
          var extra = alts[Math.floor(Math.random() * alts.length)];
          used.push(extra.q.id);
          qs.push({ q: extra.q, extra: true, from: idx[extra.kpId] ? idx[extra.kpId].kp.name : "" });
        }
      }

    var hist = A.kpHistory(student, id);
    hist.recent = ((student.kpLog || {})[id] || []).slice();
    sections.push({
        kpId: id,
        kpName: kp.name,
        unitName: item.unit.name,
        levelName: D.levelName(kp.level),
        tip: kp.tip,
        errors: kp.errors,
        status: status,
        history: hist,
        recent: hist.recent,
        questions: qs
      });
    });

    return {
      studentId: student.id,
      kpIds: kpIds,
      createdAt: new Date().toISOString().slice(0, 10),
      goals: goals,
      sections: sections,
      questionCount: used.length,
      notice: "本备课包由系统依据学情档案自动生成，教师可在下方编辑、换题后使用。"
    };
  }

  /* 换一题：同难度随机替换 */
  function swapQuestion(plan, sectionIdx, qIdx) {
    var sec = plan.sections[sectionIdx];
    var target = sec.questions[qIdx];
    if (!target) return null;
    var usedIds = [];
    plan.sections.forEach(function (s) { s.questions.forEach(function (x) { usedIds.push(x.q.id); }); });
    var alts = D.alternatives(target.q.level, usedIds);
    if (!alts.length) return null;
    var next = alts[Math.floor(Math.random() * alts.length)];
    target.q = next.q;
    if (next.kpId !== sec.kpId) target.from = "（选自：" + (D.kpIndex()[next.kpId] || {}).kp.name + "）";
    else target.from = "";
    return target;
  }

  /* 课后反馈生成 */
  function buildFeedback(student, plan, results) {
    var idx = D.kpIndex();
    var total = 0, ok = 0, partial = 0, wrong = 0;
    var weak = [], good = [], errorTags = {};

    plan.sections.forEach(function (s) {
      var kpWrong = 0, kpTotal = 0;
      s.questions.forEach(function (item) {
        var r = results[item.q.id];
        if (!r) return;
        total++; kpTotal++;
        if (r === "ok") ok++;
        else if (r === "partial") { partial++; kpWrong += 0.5; }
        else { wrong++; kpWrong++; errorTags[item.q.errorTag] = (errorTags[item.q.errorTag] || 0) + 1; }
      });
      if (kpTotal > 0 && kpWrong / kpTotal >= 0.5) weak.push(s.kpName);
      else if (kpTotal > 0 && kpWrong === 0) good.push(s.kpName);
    });

    var rate = total ? Math.round(((ok + partial * 0.5) / total) * 100) : 0;
    var topErrors = Object.keys(errorTags).sort(function (a, b) { return errorTags[b] - errorTags[a]; }).slice(0, 3);

    var summary = "本次课共练习 " + total + " 题，答对 " + ok + " 题、半对 " + partial + " 题、错误 " + wrong +
      " 题，综合正确率 " + rate + "%。" +
      (good.length ? "已掌握：" + good.join("、") + "。" : "") +
      (weak.length ? "仍需巩固：" + weak.join("、") + "。" : "");

    var suggestion = [];
    if (weak.length) suggestion.push("下次课优先复习：" + weak.join("、"));
    if (topErrors.length) suggestion.push("重点纠正错误类型：" + topErrors.join("、"));
    if (rate >= 80) suggestion.push("可提升难度，加入变式题进行拓展");
    else if (rate < 50) suggestion.push("降低难度，先补足基础题再进入进阶练习");

    var kpNames = plan.sections.map(function (s) { return s.kpName; }).join("、");
    var parent = {
      encourage: "家长您好！" + student.name + "今天上课状态不错，我们一起完成了「" + kpNames + "」的练习。" +
        (good.length ? "其中" + good.join("、") + "掌握得很好，" : "") +
        "综合正确率 " + rate + "%。" +
        (weak.length ? "「" + weak.join("、") + "」还需要再巩固，建议本周在家每天做 2~3 道同类型题，做完后让孩子讲一遍思路。" : "整体掌握扎实，可以适当做几道变式题练练手。") +
        "有情况随时联系我。",
      neutral: "家长您好，反馈一下本次课情况。上课内容：" + kpNames + "。课堂练习 " + total + " 题，正确率 " + rate + "%。" +
        (good.length ? "已掌握：" + good.join("、") + "。" : "") +
        (weak.length ? "仍需巩固：" + weak.join("、") + "。" : "") +
        (topErrors.length ? "主要错误类型：" + topErrors.join("、") + "。" : "") +
        "下次课安排：" + (suggestion[0] || "按原计划推进") + "。",
      attention: "家长您好，有几点需要您配合关注。" + student.name + "在「" + (weak.join("、") || kpNames) +
        "」这部分掌握还不牢固，本次正确率 " + rate + "%。" +
        (topErrors.length ? "主要问题是：" + topErrors.join("、") + "。" : "") +
        "建议本周固定时间做 10 分钟同类练习，做题时让孩子边做边说思路，不要只看答案。我们下次课会先回顾这部分，辛苦您配合。"
    };

    return {
      rate: rate, total: total, ok: ok, partial: partial, wrong: wrong,
      good: good, weak: weak, topErrors: topErrors,
      summary: summary, suggestions: suggestion, parent: parent
    };
  }

  /* 单次课的表现评级：good=达到掌握水平 / mid=一般 / bad=薄弱表现 */
  function gradeOf(ratio) {
    return ratio >= 0.6 ? "bad" : (ratio < 0.25 ? "good" : "mid");
  }

  /* 近三次综合判定：
   * 只有 1 次记录 → 直接采纳本次表现；
   * 最近 3 次里有 2 次以上做到「好」 → 掌握；有 2 次以上「差」 → 薄弱；否则模糊。
   * 教学依据：单次课表现有偶然性，看最近三次更能反映当前真实水平。
   */
  function decideStatus(log) {
    var recent = log.slice(-3);
    if (!recent.length) return null;
    if (recent.length === 1) {
      var g0 = gradeOf(recent[0].ratio);
      return g0 === "bad" ? "weak" : (g0 === "good" ? "mastered" : "fuzzy");
    }
    var good = 0, bad = 0;
    recent.forEach(function (r) {
      var g = gradeOf(r.ratio);
      if (g === "good") good++; else if (g === "bad") bad++;
    });
    if (bad >= 2) return "weak";
    if (good >= 2) return "mastered";
    return "fuzzy";
  }

  /* 把本次结果写回学情档案 */
  function applyResults(student, plan, results) {
    var today = new Date().toISOString().slice(0, 10);
    student.kpLog = student.kpLog || {};
    var changed = [];

    plan.sections.forEach(function (s) {
      var total = 0, wrong = 0;
      s.questions.forEach(function (item) {
        var r = results[item.q.id];
        if (!r) return;
        total++;
        if (r === "wrong") wrong += 1;
        else if (r === "partial") wrong += 0.5;
      });
      if (!total) return;

      var ratio = wrong / total;
      var log = student.kpLog[s.kpId] || [];
      log.push({ date: today, ratio: Math.round(ratio * 100) / 100 });
      if (log.length > 3) log = log.slice(-3);
      student.kpLog[s.kpId] = log;

      var before = student.mastery[s.kpId];
      var next = decideStatus(log);
      student.mastery[s.kpId] = next;
      if (before !== next) changed.push({ kpId: s.kpId, from: before, to: next });
    });

    var lesson = {
      id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date: today,
      kpIds: plan.kpIds,
      results: results,
      note: "",
      summary: ""
    };
    student.lessons = student.lessons || [];
    student.lessons.push(lesson);
    return { lesson: lesson, changed: changed };
  }

  window.KBEngine = {
    generatePlan: generatePlan,
    swapQuestion: swapQuestion,
    buildFeedback: buildFeedback,
    applyResults: applyResults
  };
})();

</script>
<script>
/* 界面逻辑：学生档案 → 智能备课 → 课堂记录 → 课后反馈 */
(function () {
  "use strict";

  var S = window.KBStore, D = window.KBData, A = window.KBAnalyze, E = window.KBEngine;
  var T = window.KBTeacher;
  var STATUS = window.KBStatus;

  var state = {
    tab: "students",
    studentId: null,
    selected: [],
    selectedInit: false,
    plan: null,
    results: {},
    feedback: null,
    tone: "encourage",
    saved: false,
    changes: [],
    showAdd: false,
    confirmDel: false,
    draft: { name: "", grade: "小学四年级", unit: 0, traits: "" }
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  /* 取当前学生，同时把数据层切到该学生所用教材 */
  function student() {
    var s = state.studentId ? S.get(state.studentId) : null;
    if (s && window.KB_Syllabus) window.KB_Syllabus.setCurrent(s.syllabus || FALLBACK_KEY);
    return s;
  }

  function toast(msg) {
    var t = $("toast");
    if (!t) return;
    t.textContent = msg;
    t.className = "toast show";
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.className = "toast"; }, 2600);
  }

  /* 空状态引导卡：任何一步都能点开，但会告诉你先做什么 */
  function guideCard(title, desc, btnText, target) {
    return '<div class="card empty"><h2>' + title + '</h2>' +
      '<p class="muted">' + desc + '</p>' +
      '<div class="actions"><button class="weui-btn weui-btn_primary" data-go="' + target + '">' + btnText + '</button></div></div>';
  }

  function bindGo() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) {
      b.onclick = function () { setTab(b.getAttribute("data-go")); };
    });
  }

  function tabReady(t) {
    if (t === "plan") return !!state.studentId;
    if (t === "record") return !!state.plan;
    if (t === "feedback") return !!state.feedback;
    return true;
  }

  /* ---------- 登录（一期为身份标识，不是安全认证） ---------- */
  function loginHtml() {
    var others = T.all().filter(function (t) { return !t.demo; });
    var h = '<div class="login-card">' +
      '<div class="login-brand"><div class="logo">课</div>' +
      '<h1>课小帮</h1>' +
      '<p class="muted small">一对一家教 · 备课 → 授课 → 学情 → 家校反馈</p></div>' +
      '<div class="form-row"><label for="login-name">老师姓名</label>' +
      '<input id="login-name" class="weui-input" type="text" maxlength="12" placeholder="例如：张老师"></div>' +
      '<div class="actions"><button class="weui-btn weui-btn_primary" id="btn-login">进入工作台</button></div>' +
      '<p class="muted small">输入姓名即可进入；同名视为同一位老师，学生档案按老师分开保存。</p>' +
      '<div class="login-sep"><span>或</span></div>' +
      '<button class="weui-btn weui-btn_default" id="btn-demo">使用演示账号（含 3 位学生与历史学情）</button>';
    if (others.length) {
      h += '<div class="login-accounts"><p class="muted small">本机已有账号（点选直接进入）</p><div class="chips">';
      others.forEach(function (t) {
        h += '<button class="chip-btn" data-acc="' + t.id + '">' + esc(t.name) + '</button>';
      });
      h += '</div></div>';
    }
    h += '<p class="login-note">演示版不校验密码：登录用于区分不同老师的数据，二期接入微信登录与云数据库后才是真实账号体系。</p>' +
      '</div>';
    return h;
  }

  function bindLogin() {
    var input = $("login-name");
    function go() {
      var r = T.enter(input ? input.value : "");
      if (r.error) { toast(r.error); if (input) input.focus(); return; }
      bootWorkspace(r.teacher, r.created);
    }
    if ($("btn-login")) $("btn-login").onclick = go;
    if (input) {
      input.onkeydown = function (e) { if (e.key === "Enter") go(); };
      try { input.focus(); } catch (e) {}
    }
    if ($("btn-demo")) $("btn-demo").onclick = function () {
      var demo = T.ensureDemo();
      T.login(demo.id);
      bootWorkspace(demo, false);
    };
    Array.prototype.forEach.call(document.querySelectorAll("[data-acc]"), function (b) {
      b.onclick = function () {
        T.login(b.getAttribute("data-acc"));
        bootWorkspace(T.current(), false);
      };
    });
  }

  function showLogin() {
    var v = $("login-view");
    if (!v) return;
    v.style.display = "";
    v.innerHTML = loginHtml();
    $("app-shell").style.display = "none";
    bindLogin();
  }

  function bootWorkspace(teacher, created) {
    if (!teacher) { showLogin(); return; }
    $("login-view").style.display = "none";
    $("app-shell").style.display = "";
    state.studentId = null;
    state.showAdd = false;
    resetFlow();
    $("cur-teacher").textContent = teacher.name + " 老师";
    var r = $("btn-reset");
    if (r) r.textContent = teacher.demo ? "恢复演示数据" : "清空本账号数据";
    setTab("students");
    if (created) toast("欢迎，" + teacher.name + "。先添加第一位学生吧");
  }

  /* ---------- 标签页 ---------- */
  function setTab(tab) {
    state.tab = tab;
    ["students", "plan", "record", "feedback"].forEach(function (t) {
      var b = $("tab-" + t), v = $("view-" + t);
      if (b) b.className = "tab" + (t === tab ? " active" : "") + (tabReady(t) ? "" : " locked");
      if (v) v.style.display = t === tab ? "block" : "none";
    });
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ---------- 学生档案 ---------- */
  function renderStudents() {
    var list = S.all();
    var html = '<div class="grid">';

    html += '<div class="list-head"><span class="weui-cells__title">学生列表（' + list.length + '）</span>' +
      '<button class="weui-btn weui-btn_primary weui-btn_mini" id="btn-add-toggle">' +
      (state.showAdd ? '收起表单' : '＋ 添加学生') + '</button></div>';
    if (state.showAdd) html += addFormHtml();

    html += '<div class="weui-cells stu-list">';
    if (!list.length) {
      html += '<div class="weui-cell"><div class="weui-cell__bd"><p class="muted small">还没有学生，点上方「添加学生」创建第一个。</p></div></div>';
    }
    list.forEach(function (s) {
      var c = A.counts(s);
      var active = s.id === state.studentId ? " active" : "";
      html += '<div class="weui-cell weui-cell_access stu-item' + active + '" data-id="' + s.id + '">' +
        '<div class="weui-cell__bd">' +
        '<p class="stu-name">' + esc(s.name) + '</p>' +
        '<div class="bar">' +
        '<span class="seg ok" style="width:' + pct(c.mastered, c) + '%"></span>' +
        '<span class="seg mid" style="width:' + pct(c.fuzzy, c) + '%"></span>' +
        '<span class="seg bad" style="width:' + pct(c.weak, c) + '%"></span>' +
        '</div>' +
        '<p class="muted small">掌握 ' + c.mastered + ' · 模糊 ' + c.fuzzy + ' · 薄弱 ' + c.weak + '</p>' +
        '</div>' +
        '<div class="weui-cell__ft">' + esc(s.grade) + ' · ' + (s.lessons ? s.lessons.length : 0) + ' 次课</div>' +
        '</div>';
    });
    html += '</div>';

    var stu = student();
    html += '<div class="card">';
    if (!stu) {
      html += '<h2>学情概览</h2><p class="muted">选择左侧学生查看学情档案。系统会根据薄弱知识点自动推荐下次课的备课重点。</p>';
    } else {
      var c = A.counts(stu), weak = A.weakPoints(stu, 5), his = A.history(stu);
      html += '<h2>' + esc(stu.name) + ' · 学情概览</h2>';
      html += '<p class="muted small">' + esc(stu.grade || "") + ' · ' + esc(D.meta().textbook + D.meta().subject + " " + D.meta().term) +
        (stu.syllabus && !syllabusKeyOf(stu.grade) ? '（该年级体系待接入，暂按此教材推荐）' : '') + '</p>';
      html += '<p class="muted small">' + esc(stu.traits || "") + '</p>';
      html += '<div class="stat-row">' + stat("掌握", c.mastered, "ok") + stat("模糊", c.fuzzy, "mid") + stat("薄弱", c.weak, "bad") + '</div>';
      html += '<h3>薄弱知识点（备课优先推荐）</h3><div class="chips">';
      if (!weak.length) html += '<span class="muted small">暂无明显薄弱点</span>';
      weak.forEach(function (w) {
        html += '<span class="chip ' + w.status + '">' + esc(w.kp.name) + ' · ' + STATUS[w.status] + '</span>';
      });
      html += '</div>';
      html += '<h3>历史正确率趋势</h3><div class="trend">';
      his.forEach(function (h) {
        html += '<div class="trend-item"><span class="trend-date">' + esc(h.date) + '</span>' +
          '<div class="trend-bar"><span style="width:' + h.rate + '%"></span></div>' +
          '<span class="trend-val">' + h.rate + '%</span></div>';
      });
      if (!his.length) html += '<span class="muted small">暂无历史记录</span>';
      html += '</div>';
      html += '<div class="actions">' +
        '<button class="weui-btn weui-btn_primary" id="btn-to-plan">为 TA 生成备课包</button>' +
        '<button class="weui-btn weui-btn_default weui-btn_mini" id="btn-del-stu">' +
        (state.confirmDel ? '再点一次确认删除' : '删除该学生') + '</button></div>';
    }
    html += '</div></div>';
    $("view-students").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".stu-item"), function (el) {
      el.onclick = function () {
        state.studentId = el.getAttribute("data-id");
        resetFlow();
        setTab("students");
      };
    });
    if ($("btn-to-plan")) $("btn-to-plan").onclick = function () { setTab("plan"); };
    if ($("btn-del-stu")) $("btn-del-stu").onclick = function () {
      if (!state.confirmDel) { state.confirmDel = true; renderStudents(); toast("再点一次「删除」即可移除该学生"); return; }
      var name = student() ? student().name : "";
      S.remove(state.studentId);
      state.confirmDel = false;
      state.studentId = null;
      resetFlow();
      setTab("students");
      toast("已删除学生：" + name);
    };
    if ($("btn-add-toggle")) $("btn-add-toggle").onclick = function () {
      state.showAdd = !state.showAdd;
      if (state.showAdd) state.draft = { name: "", grade: "小学四年级", unit: 0, traits: "" };
      renderStudents();
    };
    if (state.showAdd) bindAddForm();
  }

  /* 新建学生后清空本次流程状态 */
  function resetFlow() {
    state.selected = []; state.selectedInit = false;
    state.plan = null; state.results = {}; state.feedback = null;
    state.saved = false; state.changes = []; state.confirmDel = false;
  }

  var GRADES = ["小学一年级", "小学二年级", "小学三年级", "小学四年级",
    "小学五年级", "小学六年级", "初一", "初二", "初三"];

  /* 年级 → 教材 key。未列出的年级表示知识点体系尚未接入，
   * 添加时会明确提示，并暂用默认教材推荐（不做假装适配）。 */
  var GRADE_SYLLABUS = {
    "小学四年级": "math-g4b"
  };
  var FALLBACK_KEY = "math-g4b";

  function syllabusKeyOf(grade) {
    return GRADE_SYLLABUS[grade] || null;
  }

  function addFormHtml() {
    var d = state.draft;
    var key = syllabusKeyOf(d.grade);
    var supported = !!key;
    var syl = supported ? window.KB_Syllabus.get(key) : window.KB_Syllabus.get(FALLBACK_KEY);
    var units = syl.units;

    var h = '<div class="card add-form"><h3>添加新学生</h3>' +
      '<div class="form-row"><label for="nf-name">姓名</label>' +
      '<input id="nf-name" class="weui-input" type="text" maxlength="12" placeholder="例如：张小明" value="' + esc(d.name) + '"></div>' +
      '<div class="form-row"><label for="nf-grade">年级</label><select id="nf-grade" class="weui-input">';
    GRADES.forEach(function (g) {
      h += '<option' + (g === d.grade ? ' selected' : '') + '>' + g + '</option>';
    });
    h += '</select></div>';

    h += '<div class="form-row"><label for="nf-unit">当前进度</label><select id="nf-unit" class="weui-input">' +
      '<option value="-1"' + (d.unit === -1 ? ' selected' : '') + '>暂不评估（留空档案，随上课记录填充）</option>';
    units.forEach(function (u, i) {
      h += '<option value="' + i + '"' + (d.unit === i ? ' selected' : '') + '>' + esc(u.name) + '</option>';
    });
    h += '</select></div>';

    h += '<div class="form-row"><label for="nf-traits">学生特点</label>' +
      '<input id="nf-traits" class="weui-input" type="text" maxlength="40" placeholder="选填：计算粗心、读题慢…" value="' + esc(d.traits) + '"></div>';

    h += '<p class="muted small">已接入教材：<strong>' + esc(syl.textbook + syl.subject + " · " + syl.grade + syl.term) + '</strong>。' +
      (supported ? '' : ' 该年级的知识点体系尚未接入，将暂按上述教材推荐备课内容。') + '</p>' +
      '<p class="muted small">选择起始单元后，系统把该单元及之前单元的知识点初始化为「模糊」；选「暂不评估」则档案留空。</p>' +
      '<div class="actions">' +
      '<button class="weui-btn weui-btn_primary" id="btn-add-save">保存并选中</button>' +
      '<button class="weui-btn weui-btn_default" id="btn-add-cancel">取消</button></div></div>';
    return h;
  }

  /* 重绘前把输入值收进草稿，避免切换年级时丢内容 */
  function syncDraft() {
    var n = $("nf-name"), t = $("nf-traits"), u = $("nf-unit");
    if (n) state.draft.name = n.value;
    if (t) state.draft.traits = t.value;
    if (u) state.draft.unit = +(u.value || 0);
  }

  function bindAddForm() {
    var save = $("btn-add-save"), cancel = $("btn-add-cancel");
    var grade = $("nf-grade"), unit = $("nf-unit");
    if (cancel) cancel.onclick = function () { state.showAdd = false; renderStudents(); };
    /* 年级变了 → 进度下拉要跟着换成该年级教材的单元 */
    if (grade) grade.onchange = function () { syncDraft(); state.draft.grade = grade.value; state.draft.unit = 0; renderStudents(); };
    if (unit) unit.onchange = function () { syncDraft(); };
    if (save) save.onclick = function () {
      syncDraft();
      var name = (state.draft.name || "").trim();
      if (!name) { toast("请填写学生姓名"); return; }

      var key = syllabusKeyOf(state.draft.grade) || FALLBACK_KEY;
      var syl = window.KB_Syllabus.get(key);
      var mastery = {};
      if (state.draft.unit >= 0) {
        for (var i = 0; i <= state.draft.unit && i < syl.units.length; i++) {
          syl.units[i].kps.forEach(function (kp) { mastery[kp.id] = "fuzzy"; });
        }
      }
      var stu = {
        id: S.newId(),
        name: name,
        grade: state.draft.grade,
        syllabus: key,
        traits: (state.draft.traits || "").trim(),
        mastery: mastery,
        kpLog: {},
        lessons: []
      };
      S.add(stu);
      state.showAdd = false;
      state.studentId = stu.id;
      resetFlow();
      setTab("students");
      var tip = syllabusKeyOf(state.draft.grade) ? "" : "，该年级知识点待接入，暂按默认教材推荐";
      toast("已添加学生：" + name + tip);
    };
  }

  function gradeText(ratio) {
    return ratio >= 0.6 ? '差' : (ratio < 0.25 ? '好' : '中');
  }

  function pct(n, c) {
    var t = c.mastered + c.fuzzy + c.weak;
    return t ? Math.round((n / t) * 100) : 0;
  }
  function stat(label, n, cls) {
    return '<div class="stat ' + cls + '"><div class="stat-num">' + n + '</div><div class="stat-label">' + label + '</div></div>';
  }

  /* ---------- 智能备课 ---------- */
  function renderPlan() {
    var stu = student();
    if (!stu) {
      $("view-plan").innerHTML = guideCard("还没有选择学生", "请先到「学生档案」里选一名学生，系统会依据 TA 的薄弱知识点推荐备课重点。", "去选择学生", "students");
      bindGo();
      return;
    }
    if (!state.plan) {
      var rec = A.priorityKps(stu).slice(0, 6);
      if (!state.selectedInit) {
        state.selectedInit = true;
        state.selected = rec.slice(0, 3).map(function (r) { return r.id; });
      }
      var html = '<div class="card"><h2>第 1 步 · 选择本次课知识点</h2>' +
        '<p class="muted small">系统已按薄弱程度排序，默认勾选最需要巩固的知识点。</p><div class="chips">';
      rec.forEach(function (r) {
        var on = state.selected.indexOf(r.id) !== -1;
        html += '<button class="chip-btn ' + r.status + (on ? " on" : "") + '" data-kp="' + r.id + '">' +
          esc(r.kp.name) + ' <em>' + STATUS[r.status] + '</em></button>';
      });
      html += '</div>';

      html += '<details class="more"><summary>查看全部知识点（按单元）</summary>';
      D.units().forEach(function (u) {
        html += '<div class="unit"><div class="unit-name">' + esc(u.name) + '</div><div class="chips">';
        u.kps.forEach(function (kp) {
          var st = stu.mastery[kp.id];
          var on = state.selected.indexOf(kp.id) !== -1;
          html += '<button class="chip-btn ' + (st || "") + (on ? " on" : "") + '" data-kp="' + kp.id + '">' +
            esc(kp.name) + (st ? ' <em>' + STATUS[st] + '</em>' : '') + '</button>';
        });
        html += '</div></div>';
      });
      html += '</details>';

      html += '<div class="actions"><button class="weui-btn weui-btn_primary" id="btn-gen">生成备课包</button>' +
        '<span class="muted small" id="gen-tip"></span></div></div>';
      $("view-plan").innerHTML = html;

      Array.prototype.forEach.call(document.querySelectorAll(".chip-btn"), function (b) {
        b.onclick = function () {
          var id = b.getAttribute("data-kp"), i = state.selected.indexOf(id);
          if (i === -1) state.selected.push(id); else state.selected.splice(i, 1);
          renderPlan();
        };
      });
      $("btn-gen").onclick = function () {
        if (!state.selected.length) { toast("请至少勾选一个知识点"); return; }
        $("gen-tip").textContent = "正在根据学情档案生成…";
        $("btn-gen").disabled = true;
        setTimeout(function () {
          state.plan = E.generatePlan(S.get(state.studentId), state.selected);
          state.results = {}; state.feedback = null; state.saved = false;
          renderPlan();
        }, 900);
      };
      return;
    }

    var p = state.plan;
    var html = '<div class="card"><h2>备课包 · ' + esc(p.createdAt) + '</h2>' +
      '<p class="muted small">' + esc(p.notice) + '</p>';

    html += '<h3>教学目标</h3><ol class="goals">';
    p.goals.forEach(function (g) { html += '<li>' + esc(g) + '</li>'; });
    html += '</ol>';

    p.sections.forEach(function (s, si) {
      html += '<div class="section"><div class="row-between"><h3>' + esc(s.kpName) + '</h3>' +
        '<span class="tag ' + s.status + '">' + STATUS[s.status] + ' · ' + esc(s.levelName) + '</span></div>' +
        '<div class="muted small">' + esc(s.unitName) + '</div>' +
        '<div class="tip"><strong>讲解要点：</strong>' + esc(s.tip) + '</div>' +
        '<div class="tip warn"><strong>易错提醒：</strong>' + esc(s.errors.join("；")) + '</div>' +
        (s.history.total ? '<div class="muted small">历史练习 ' + s.history.total + ' 题，其中 ' + s.history.wrong + ' 题未答对</div>' : '') +
        (s.recent && s.recent.length ? '<div class="muted small">近 ' + s.recent.length + ' 次课堂表现：' +
          s.recent.map(function (r) { return gradeText(r.ratio); }).join(' → ') + '</div>' : '');
      html += '<ul class="qlist">';
      s.questions.forEach(function (item, qi) {
        var q = item.q;
        html += '<li class="qitem">' +
          '<div class="row-between"><span class="qtag">' + D.levelName(q.level) + (item.extra ? ' · 补充' : '') + '</span>' +
          '<span class="muted small">' + esc(item.from || "") + '</span></div>' +
          '<div class="stem">' + esc(q.stem) + '</div>' +
          '<div class="qans" id="ans-' + si + '-' + qi + '" style="display:none">' +
          '<div><strong>答案：</strong>' + esc(q.answer) + '</div>' +
          '<div class="muted"><strong>解析：</strong>' + esc(q.solution) + '</div></div>' +
          '<div class="qbtns">' +
          '<button class="weui-btn weui-btn_default weui-btn_mini" data-toggle="' + si + '-' + qi + '">显示答案</button>' +
          '<button class="weui-btn weui-btn_default weui-btn_mini" data-swap="' + si + '-' + qi + '">换一题</button>' +
          '</div></li>';
      });
      if (!s.questions.length) html += '<li class="muted small">该知识点题库待补充，可先用讲解要点授课。</li>';
      html += '</ul></div>';
    });

    html += '<div class="actions">' +
      '<button class="weui-btn weui-btn_primary" id="btn-to-record">进入课堂记录</button>' +
      '<button class="weui-btn weui-btn_default" id="btn-export">导出备课包文本</button>' +
      '<button class="weui-btn weui-btn_default" id="btn-regen">重新选择知识点</button></div>';
    html += '<textarea id="export-box" class="export" style="display:none"></textarea></div>';
    $("view-plan").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("[data-toggle]"), function (b) {
      b.onclick = function () {
        var box = $("ans-" + b.getAttribute("data-toggle"));
        var show = box.style.display === "none";
        box.style.display = show ? "block" : "none";
        b.textContent = show ? "隐藏答案" : "显示答案";
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-swap]"), function (b) {
      b.onclick = function () {
        var key = b.getAttribute("data-swap").split("-");
        if (!E.swapQuestion(state.plan, +key[0], +key[1])) toast("暂无更多同难度备选题");
        renderPlan();
      };
    });
    $("btn-to-record").onclick = function () { setTab("record"); };
    $("btn-regen").onclick = function () { state.plan = null; renderPlan(); };
    $("btn-export").onclick = function () {
      var t = exportText();
      var box = $("export-box");
      box.style.display = "block";
      box.value = t;
      copy(t);
      toast("备课包文本已生成并复制到剪贴板");
    };
  }

  function exportText() {
    var p = state.plan, stu = student();
    var t = "课小帮 · 备课包\n学生：" + stu.name + "　日期：" + p.createdAt + "\n\n【教学目标】\n";
    p.goals.forEach(function (g, i) { t += (i + 1) + ". " + g + "\n"; });
    p.sections.forEach(function (s) {
      t += "\n【" + s.kpName + "】（" + s.unitName + "）\n";
      t += "讲解要点：" + s.tip + "\n易错提醒：" + s.errors.join("；") + "\n";
      s.questions.forEach(function (item) {
        t += "· [" + D.levelName(item.q.level) + "] " + item.q.stem + "　答案：" + item.q.answer + "\n";
      });
    });
    return t;
  }

  /* ---------- 课堂记录 ---------- */
  function renderRecord() {
    if (!state.plan) {
      $("view-record").innerHTML = guideCard("还没有备课包", "课堂记录是围绕备课包里的题目来勾选的，请先到「智能备课」生成一节备课包。", "去生成备课包", "plan");
      bindGo();
      return;
    }
    var p = state.plan;
    var html = '<div class="card"><h2>课堂记录 · 勾选掌握情况</h2>' +
      '<p class="muted small">每题一键勾选，系统据此更新学情档案并生成课后反馈。</p>';
    var n = 0;
    p.sections.forEach(function (s) {
      html += '<div class="section"><h3>' + esc(s.kpName) + '</h3><ul class="qlist">';
      s.questions.forEach(function (item) {
        n++;
        var r = state.results[item.q.id] || "";
        html += '<li class="qitem"><div class="stem">' + n + '. ' + esc(item.q.stem) + '</div>' +
          '<div class="mark">' +
          markBtn(item.q.id, "ok", "掌握", r) +
          markBtn(item.q.id, "partial", "半会", r) +
          markBtn(item.q.id, "wrong", "不会", r) +
          '</div><div class="muted small">正确答案：' + esc(item.q.answer) + '</div></li>';
      });
      html += '</ul></div>';
    });
    html += '<div class="actions"><button class="weui-btn weui-btn_primary" id="btn-fb">保存并生成课后反馈</button>' +
      (state.saved ? '<span class="muted small">已写入学情档案</span>' : '') + '</div></div>';
    $("view-record").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("[data-mark]"), function (b) {
      b.onclick = function () {
        state.results[b.getAttribute("data-mark")] = b.getAttribute("data-val");
        renderRecord();
      };
    });
    $("btn-fb").onclick = function () {
      var stu = S.get(state.studentId);
      state.feedback = E.buildFeedback(stu, p, state.results);
      if (!state.saved) {
        var res = E.applyResults(stu, p, state.results);
        res.lesson.summary = state.feedback.summary;
        S.update(stu);
        state.saved = true;
        state.changes = res.changed || [];
      }
      setTab("feedback");
    };
  }

  function markBtn(qid, val, label, cur) {
    return '<button class="weui-btn weui-btn_mini weui-btn_default mark-btn ' + val + (cur === val ? " on" : "") + '" data-mark="' + qid + '" data-val="' + val + '">' + label + '</button>';
  }

  /* ---------- 课后反馈 ---------- */
  function renderFeedback() {
    if (!state.feedback) {
      $("view-feedback").innerHTML = guideCard("还没有课后反馈", "课后反馈由课堂记录的勾选结果自动生成，请先完成「课堂记录」的勾选。", "去填写课堂记录", "record");
      bindGo();
      return;
    }
    var f = state.feedback, stu = student();
    var html = '<div class="card"><h2>课后学情分析</h2>' +
      '<div class="stat-row">' + stat("正确率", f.rate + "%", f.rate >= 80 ? "ok" : (f.rate >= 50 ? "mid" : "bad")) +
      stat("答对", f.ok, "ok") + stat("半会", f.partial, "mid") + stat("错误", f.wrong, "bad") + '</div>' +
      '<p>' + esc(f.summary) + '</p>' +
      (state.changes.length ? '<div class="tip"><strong>学情档案已更新：</strong>' +
        state.changes.map(function (c) {
          var it = D.kpIndex()[c.kpId];
          return esc(it ? it.kp.name : c.kpId) + '：' + (c.from ? STATUS[c.from] : '未评估') + ' → ' + STATUS[c.to];
        }).join('；') + '</div>' : '') +
      (f.good.length ? '<div class="tip"><strong>已掌握：</strong>' + esc(f.good.join("、")) + '</div>' : '') +
      (f.weak.length ? '<div class="tip warn"><strong>仍需巩固：</strong>' + esc(f.weak.join("、")) + '</div>' : '') +
      (f.topErrors.length ? '<div class="tip warn"><strong>主要错误类型：</strong>' + esc(f.topErrors.join("、")) + '</div>' : '');

    html += '<h3>下次课建议</h3><ul class="goals">';
    f.suggestions.forEach(function (s) { html += '<li>' + esc(s) + '</li>'; });
    html += '</ul></div>';

    html += '<div class="card"><h2>家长反馈话术</h2><div class="tones">' +
      toneBtn("encourage", "鼓励型") + toneBtn("neutral", "客观型") + toneBtn("attention", "需关注") +
      '</div><div class="talk" id="talk-box">' + esc(f.parent[state.tone]) + '</div>' +
      '<div class="actions"><button class="weui-btn weui-btn_primary" id="btn-copy">复制话术</button>' +
      '<button class="weui-btn weui-btn_default" id="btn-report">生成家长报告</button></div>' +
      '<div id="report-box" style="display:none"></div></div>';
    $("view-feedback").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("[data-tone]"), function (b) {
      b.onclick = function () { state.tone = b.getAttribute("data-tone"); renderFeedback(); };
    });
    $("btn-copy").onclick = function () { copy(f.parent[state.tone]); toast("话术已复制到剪贴板"); };
    $("btn-report").onclick = function () {
      var box = $("report-box");
      box.style.display = "block";
      box.innerHTML = '<div class="report" id="report">' + reportHtml() + '</div>' +
        '<div class="actions"><button class="weui-btn weui-btn_default" id="btn-print">打印 / 存为 PDF</button></div>';
      $("btn-print").onclick = function () { window.print(); };
    };
  }

  function toneBtn(key, label) {
    return '<button class="chip-btn' + (state.tone === key ? " on" : "") + '" data-tone="' + key + '">' + label + '</button>';
  }

  function reportHtml() {
    var f = state.feedback, stu = student();
    var h = '<h2>' + esc(stu.name) + ' · 学情报告</h2><p class="muted small">生成日期：' + new Date().toISOString().slice(0, 10) + '</p>';
    h += '<p>' + esc(f.summary) + '</p>';
    h += '<h3>知识点掌握情况</h3><ul>';
    var list = A.priorityKps(stu);
    list.forEach(function (x) { h += '<li>' + esc(x.kp.name) + '：' + STATUS[x.status] + '</li>'; });
    h += '</ul>';
    h += '<h3>给家长的建议</h3><p>' + esc(f.parent[state.tone]) + '</p>';
    return h;
  }

  function copy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) {}
  }

  function render() {
    if (state.tab === "students") renderStudents();
    else if (state.tab === "plan") renderPlan();
    else if (state.tab === "record") renderRecord();
    else if (state.tab === "feedback") renderFeedback();
    var stu = student();
    $("cur-student").textContent = stu ? "当前学生：" + stu.name : "未选择学生";
  }

  document.addEventListener("DOMContentLoaded", function () {
    ["students", "plan", "record", "feedback"].forEach(function (t) {
      var b = $("tab-" + t);
      if (b) b.onclick = function () { setTab(t); };
    });
    var r = $("btn-reset");
    if (r) r.onclick = function () {
      var t = T.current();
      S.reset();
      state.studentId = null;
      state.showAdd = false;
      resetFlow();
      setTab("students");
      toast(t && t.demo ? "已恢复为初始演示数据" : "已清空本账号的学生数据");
    };
    var out = $("btn-logout");
    if (out) out.onclick = function () {
      T.logout();
      state.studentId = null;
      state.showAdd = false;
      resetFlow();
      showLogin();
      toast("已退出，数据仍保留在本机");
    };

    var cur = T.current();
    if (cur) bootWorkspace(cur, false);
    else showLogin();
  });

  window.KBApp = { setTab: setTab, state: state };
})();

</script>
</body>
</html>
